 going to try ～ でも可。"]]}, {"t": "問10 ダックスフンドの会話文", "items": [["(1)A", "ア", "dachshund はドイツ原産の犬で足が短いのが特徴。that has short legs（足が短い）が合う。"], ["(2)", "C", "「私は食べ物の名前を聞いたことがない」。直前のBの発言ではなく、Aの「アメリカの食べ物の名前でもあった」の流れで、Bが聞き返す前の C に入る。【空所位置は文の流れから判断しています。念のため原本もご確認ください】"], ["(3)E", "イ", "dachshund が現在の名前としてみんなに使われているもの＝ Hot dog。"]]}, {"t": "問11 健人の町の説明", "items": [["(1)", "biggest", "下線部① big は「この町でいちばん大きな店」の意味なので最上級 biggest。"], ["(2)", "エ", "本文：スーパーは「欲しいものが手に入る」大きな店。健人はスーパーが役に立つと考えている。"], ["(3)", "ウ", "本文は病院・公園がない問題を述べている。マークの返事として、イ（どこでサッカーを？）やア（ありがとう）は自然。ウは内容と合わない。【ウとエのどちらも話題と合わない。念のため原本の模範解答もご確認ください】"]]}, {"t": "問12 トーマスの話", "items": [["(1)", "who", "「～する高校生」「～がない友達」と人を説明するので関係代名詞 who。"], ["(2)", "友達がステージで楽器を演奏する準備をしていたこと。", "下線部②の直前の文に理由が書かれている。"], ["(3)", "私たちが練習した曲を歌ってくれませんか。", "Could you ～? は「～してくれませんか」。we practiced は song を説明している（私たちが練習した歌）。"], ["(4)", "イ", "友達の思いやりで立ち直る話。タイトルは The Importance of Friends（友達の大切さ）。"], ["(5)", "例：I remember the school trip. My friends and I enjoyed the beach very much.", "2文以上、10語以上。主語と動詞のある文で書く。"]]}], "R4_math": [{"t": "問1 計算", "items": [["(1)", "6", "−3＋9＝＋(9−3)＝6。"], ["(2)", "−9.6", "1.2×8＝9.6。マイナスが1つなので−9.6。"], ["(3)", "−1/14", "通分して6/14−7/14＝−1/14。"], ["(4)", "8/25", "わり算は逆数のかけ算。−8/15×(−3/5)。マイナス同士でプラス。約分して24/75＝8/25。"], ["(5)", "7", "−3²＝−9、(−2)⁴＝16。−9＋16＝7。"], ["(6)", "√2", "√18＝3√2、√8＝2√2。3√2−2√2＝√2。"], ["(7)", "−3x²y", "−18÷6＝−3、x³÷x＝x²、y²÷y＝y。"], ["(8)", "x²−x−20", "(x＋4)(x−5)＝x²−5x＋4x−20＝x²−x−20。"]]}, {"t": "問2 小問集合", "items": [["(1)", "−1，0，1", "絶対値が2より小さい整数は、数直線で0から2未満の距離にある整数。"], ["(2)", "半分（0.5倍）", "例：「半分」。x円の半分は0.5x円。「2分の1」でも可。"], ["(3)", "x＝4（まちがえ始めは2行目）", "3x−5＝x＋3 の2行目「3x＋x＝3＋5」が誤り。xを左辺に移項すると符号が変わるので3x−x＝3＋5。2x＝8より x＝4。"], ["(4)", "例：1＋(−3)", "自然数＋整数の結果が自然数にならない例。1＋(−3)＝−2（自然数ではない）。他に2＋(−5)など。"]]}, {"t": "問3 速さ・文章題", "items": [["(1)", "20分", "1500÷75＝20（分）。"], ["(2)", "30分", "帰りは1500÷150＝10（分）。20＋10＝30分。"], ["(3)", "1200m", "太郎さんは20分後に公園に着き、折り返す。花子さんが出発するのは18分後。出発からt分後に会うとすると、太郎さんは学校から1500−150(t−20)、花子さんは300(t−18)の位置。150 。「売」と「店」。"]]}, {"t": "二 小説（藤原てい『旅路』）", "items": [["問一", "Ⅰ耳，Ⅱ肩，Ⅲ腹", "「聞く耳を持つ」「肩を降ろす」「腹がたつ」。身体の部位を使った慣用句。"], ["問二", "ウ", "「きびしく」は形容詞「きびしい」の連用形（活用して「きびしかった」「きびしければ」となる）。副詞は活用しないので、形容詞。【原本の解答が手元にないため、文法から判断した解答です。念のため原本もご確認ください】"], ["問三", "上諏訪の駅で、子供達が自分で注意して降りること。", "部Aの直前「責任を持って列車に乗るという態度を覚えさせなくては」と、後ろの「上諏訪の駅はわかる筈…自分で…降りる」から、母が期待したことをまとめる。"], ["問四", "子供達がワイワイさわぎ立てて、駅に着いたと気づかなかったから。", "子供達は「ワイワイさわぎ立てていて」、母の言葉を「聞く耳を持つかどうか」わからなかったという描写から。"], ["問五", "後悔", "Ⅹ「をおぼえた」。つづく「しかし、それはすべきではない、と思いかえした」から、あのとき教えてやるべきだったという気持ちなので「後悔」。"], ["問六", "新宿で乗る時", "「あの時」は、直前の「新宿で乗る時に、上諏訪で下車することは言ってある」の「新宿で乗る時」を指す。解答欄に合わせて答える。"], ["問七", "子供達が降りず、私一人がホームに残されてしまうこと。", "「このようなこと」は、直前の場面（誰も降りてこず、列車が行ってしまい、私一人がホームに残された）を指す。主語を明らかにする。"], ["問八", "母として厳しく接しながらも、泣く姿に抱き上げたいほどいとおしさを感じる気持ちで表現されている。", "厳しい口調で言い聞かせつつ、泣く子の姿に「抱き上げてやりたいほど、いとおしかった」と書かれている。40〜50字でまとめる。【記述なので、「厳しさ」と「いとおしさ」の両方が入っていればよい。念のため原本の採点基準もご確認ください】"]]}, {"t": "三 論説文（会話・図表の読み取り）", "items": [["問一ア", "社会の一員", "図Aの項目名「自分は責任ある社会の一員だと思う」から抜き出す（字数は解答欄に合わせる）。"], ["問一イ", "変えられる", "図Aの項目名「自分で国や社会を変えられると思う」から。"], ["問一ウ", "社会課題", "図Aの項目名「自分の国に解決したい社会課題がある」から。"], ["問二Ⅰ", "他人", "「うまくいかないことが起きると、他人のせいにしがち」。自律できない人の特徴。"], ["問三", "ご存じですか", "「知っていますか」の尊敬語は「ご存じですか」。"], ["問四", "日本の発電は、火力発電が約七割を占めているから。", "図Bの日本は、石炭31.9％＋天然ガス37.1％＋石油6.8％＝約75.8％が火力。【七割台です。念のため原本の模範解答もご確認ください】"], ["問五Ⅱ", "原子力", "フランスは原子力が71.6％で最も多い。"], ["問五Ⅲ", "カナダ", "水力発電の割合が高いのは、水力59.0％のカナダ。"], ["問六Ⅳ①", "当事者意識", "俊太郎の「他人事にしているだけではいけません」の反対が、本文の「当事者意識」。"], ["問六Ⅳ②", "他人事", "「当事者意識」の反対の意味の語は漢字三字の「他人事」。"]]}, {"t": "四 古文（古事記）", "items": [["問一a", "のりたまいしく", "「詔りたまひしく」。語頭以外の「ひ」は「い」に直す。"], ["問一b", "いうなり", "「言ふなり」。「ふ」は「う」に直す。"], ["問二", "煙は炊事のかまどの煙で、それが立たず民が貧しいと考えたから。", "「国に煙立たず。国皆貧窮し」。煙＝かまどの煙（炊事の煙）で、煙が立たないのは人々が食事をつくれないほど貧しいから、と天皇は考えた。"], ["問三", "修繕の労役で貧しい民をさらに苦しめたくなかったから。", "修理を命じれば役を課すことになり、すでに苦しい民をさらに苦しめる。だから修繕しなかった。"], ["問四", "人民", "「百姓」は「人民」と同じ意味で使われている。"], ["問五Ⅰ", "貧しい", "空欄Ⅰ：民の暮らしが貧しいと察した。"], ["問五Ⅱ", "納税", "空欄Ⅱ：「課」＝納税（語注）を免除した。"], ["問五Ⅲ", "労役", "空欄Ⅲ：「役」＝労役（語注）を免除した。"], ["問五Ⅳ", "豊かに", "空欄Ⅳ：「人民富めり」の study English", "It is important to ～ で「～することは重要です」。It は形式主語。"], ["(2)", "long have you played tennis", "「どのくらいの間」＝ How long。現在完了継続の疑問文 have you played。"], ["(3)", "don't have to come here", "「～する必要はない」＝ don't have to ＋動詞の原形。You don't have to come here afternoon."], ["(4)", "is the bag that I made", "This is the bag that I made yesterday.「これは私が昨日作ったバッグです」。that I made が the bag を後ろから説明。"]]}, {"t": "問12 会話文（ホームステイ）", "items": [["(1)", "イ", "「ちょっと待って」のあとで、Here you are（はい、どうぞ）と渡している。直後の「開けていい？」から、プレゼントを渡す場面。I have a present for you."], ["(2)", "エ", "「これはハワイのドレス（ムームー）です」「それはいいね。夏にいいですね」。It's good for summer season."], ["(3)", "カ", "着た姿を見て「とても似合っています」。そのあとに「写真を撮りましょうか」と提案し、Yes, please. と答えている。Shall I ～?（～しましょうか）に Yes, please. が合う。"]]}, {"t": "問13 長文（水と人体／海の生き物）", "items": [["(1)", "Because we can't live for more than about three days without water.", "Water is very important for the human body. のすぐあとの文が理由。「水なしでは約3日しか生きられない」。Because ＋主語＋動詞の形で書く。"], ["(2)", "食べ物と酸素を体の各部分へ運ぶこと。", "本文「血液は食べ物を体のいろいろな部分に運ぶ。また、肺から体の他の部分に酸素も運ぶ」。"], ["(3)", "Water is very important.", "例。水の大切さが全体のテーマ。主語と動詞のある3語以上で書く。例：Water is very important. / We need water. など。"], ["(4)", "the blue whale", "It は直前の文の The biggest ocean animal is the blue whale. を受ける。"], ["(5)", "most of the oceans", "本文最後「Blue whales live in most of the oceans.」。「They live in (most)(of)(the)(oceans).」"], ["(6)", "animals", "「Some (animals) live in salt water.」「Many other (animals) live in salt water.」共通する語は animals。"], ["(7)", "例：I use water to wash my hands and cook dinner every day.", "主語と動詞のある5語以上で、本文をそのまま写さずに書く。例：I drink water every day. / I use water to take a bath. など。"]]}], "R3_math": [{"t": "問1 計算", "items": [["(1)", "−5", "3＋(−8)＝3−8＝−5。"], ["(2)", "−63", "7×9＝63。マイナスが1つなので−63。"], ["(3)", "−1/6", "通分して2/6−3/6＝−1/6。"], ["(4)", "36", "わり算は逆数のかけ算。−6×(−6)＝36。"], ["(5)", "−1", "−3²＝−9。−9＋8＝−1。（−3²は「3²にマイナス」で、(−3)²ではない）"], ["(6)", "√6", "√24＝2√6。2√6−√6＝√6。"]]}, {"t": "問2 小問集合", "items": [["(1)", "300円の支出（300円使うこと）", "＋が「収入」なら、反対の意味の−は「支出」。"], ["(2)", "1/2", "3以下の目は1，2，3の3通り。全部で6通りなので3/6＝1/2。"], ["(3)", "1000−4a（円）", "ケーキ代は a×4＝4a円。おつりは 1000−4a（円）。"], ["(4)", "x²−5x＋6", "(x−2)(x−3)＝x²−3x−2x＋6＝x²−5x＋6。"]]}, {"t": "問3 小問集合", "items": [["(1)", "素数ではない", "37²＝37×37＝1369。37と37のかけ算なので、1と自分自身以外の約数37をもつ。素数ではない。"], ["(2)", "長方形", "円柱を底面に垂直に切ると切り口は長方形（高さの辺と、底面の直径をふくむ辺をもつ）。"], ["(3)", "図の正方形の左端の頂点に○", "四角錐では、底面の4つの頂点それぞれに側面の三角形が2枚ずつ集まる。展開図を組み立てると、点Aは底面の正方形の頂点（図で一番左）と重なる。【図に○を記入】"], ["(4)", "直方体の体積", "縦×横×高さ＝体積。"], ["(5)", "1，2，3", "√a＜2 は √a＜√4 なので a＜4。自然数は1，2，3。"]]}, {"t": "問4 文章題（クッキー）", "items": [["(1)", "3x＋16", "3枚ずつx人に配ると3x枚、16枚余ったので全部で3x＋16（枚）。"], ["(2)", "3x＋16＝4x＋7", "4枚ずつ配ると7枚余る。全部の枚数は4x＋7（枚）。(1)の式と等しいので、3x＋16＝4x＋7。"], ["(3)", "9人", "3x＋16＝4x＋7 を解く。16−7＝4x−3x より x＝9。"], ["(4)", "2枚足りない", "クッキーは3×9＋16＝43（枚）。5枚ずつ配ると5×9＝45（枚）必要なので、45−43＝2（枚）足りない。"]]}, {"t": "問5 文字式の説明", "items": [["①", "2m", "偶数は2×整数。mを使って2m。"], ["②", "2n＋1", "奇数は2×整数＋1。nを使って2n＋1。"], ["③", "2(m＋n)＋1", "2m＋(2n＋1)＝2m＋2n＋1＝2(m＋n)＋1。"], ["④", "整数", "m，nは整数なので、m＋nも整数。"], ["⑤", "奇数", "2×整数＋1の形なので奇数。偶数と奇数の和は奇数になる。"]]}, {"t": "問6 折り返し（直角三角形）", "items": [["(1)AQ", "4cm", "点BがAに重なるので、折り目PQはABの垂直二等分線。Qは ABの中点なのでAQ＝8÷2＝4（cm）。"], ["(1)面積", "18cm²", "PQ∥AC（どちらもABに垂直）なので△BQP∽△BAC（相似比1：2）。PQ＝3cm、QB＝4cm。△BQP＝4×3÷2＝6（cm²）。△ABC＝8×6÷2＝24（cm²）。四角形AQPC＝24−6＝18（cm²）。"], ["(2)CS", "5cm", "点BがCに重なるので、折り目RSはBCの垂直二等分線。SはBCの中点なのでCS＝10÷2＝5（cm）。"], ["(2)面積", "117/8 cm²", "△BSR∽△BAC（共通の角Bと直角）。BS：BA＝5：8なので、SR＝6×5/8＝15/4（cm）。△BSR＝5×15/4×1/2＝75/8（cm²）。四角形ARSC＝△ABC−△BSR＝24−75/8＝117/8（cm²）。"]]}, {"t": "問7 関数 y＝1/2x²と直線", "items": [["(1)", "(−2，2)", "y＝1/2×(−2)²＝2。"], ["(2)", "y＝−x", "原点O(0，0)とA(−2，2)を通る直線。傾き＝2÷(−2)＝−1。"], ["(3)", "y＝x＋4", "B(4，8)。傾き＝(8−2)÷(4−(−2))＝1。y＝x＋b にA(−2，2)を代入すると b＝4。"], ["(4)", "y＝1/5x＋12/5", "C(−4，0)。△BCO＝4×8÷2＝16。Aは辺CB上にあり、BA：BC＝6：8＝3：4。Aを通り面積を半分にする直線が辺BOと交わる点をMとし、BM：BO＝t とすると △ABM＝△BCO×3/4×t＝16×3/4×t＝12t＝8 より t＝2/3。M＝(4/3，8/3)。AとMを通る直線の傾きは(8/3−2)÷(4/3＋2)＝1/5。y＝1/5x＋b にA(−2，2)を代入して b＝12/5。"]]}], "R3_japanese": [{"t": "一 漢字・熟語・文法", "items": [["問一①", "付", "手に絵の具が付く。「くっつく」の意味は「付く」。（「着く」は到着、「就く」は職や位置に入る意味）【原本の予想解答は「着」。念のため確認】"], ["問一②", "就", "職に就く。「就職」の「就」。"], ["問一③", "音", "笛の音（ね）。「音」には「ね」の訓読みがある。"], ["問一④", "値", "値上がり。物の値段は「値」。"], ["問一⑤", "変", "形を変える。「変化」の「変」。"], ["問一⑥", "代", "社長に代わってあいさつする。「代理」の「代」。"], ["問一⑦", "初", "初めての経験。「初」。"], ["問一⑧", "始", "試合が始まる。「開始」の「始」。"], ["問一⑨", "乳", "牛の乳を搾る。「牛乳」の「乳」。"], ["問一⑩", "父", "父を呼ぶ。「父」。"], ["問二①〜⑤", "①お ②げ ③あたた ④おん ⑤おか", "①許可が下りる（おりる）。②途中下車（げしゃ）。③温かい料理（あたたかい）。④地球温暖化（おんだんか）。⑤過ちを犯す（おかす）。"], ["問二⑥〜⑩", "⑥はん ⑦げ ⑧ほか ⑨わざ ⑩ぎょう", "⑥犯罪（はんざい）。⑦外科（げか）。⑧思いの外（ほか）。⑨至難の業（わざ）。⑩授業（じゅぎょう）。"], ["問三", "①百 ②一 ③心 ④適 ⑤半", "①百発百中。②一期一会。③以心伝心。④適材適所。⑤半信半疑。"], ["問四", "①車 ②来る ③問題 ④難しい ⑤はやいなあ", "修飾する語は、修飾される語（体言・用言）につながる文節を探す。①黒い→（古い）車を修飾。②きっと→来る。③あの→問題。④やはり→難しい。⑤「夏の夜明けは」は、うしろの「はやいなあ」を修飾する（倒置）。"]]}, {"t": "二 論説文（外山滋比古『おしゃべりの思想』）", "items": [["問一", "a口調 b ぜっきょう c呼応 d微妙 e びんかん", "a クチョウ＝口調。b 絶叫（ぜっきょう）。c コオウ＝呼応。d ビミョウ＝微妙。e 敏感（びんかん）。"], ["問二A", "イ", "「口をせわしく動かしている割には話の進みはのろい。[A]一気にしゃべってしまえないのか。」と疑問の形になるので「なぜ」。"], ["問二B", "ウ", "「それでも家の中だと[B]いくらかおだやかだが、外へ出ると…」。「まだ」おだやかだ、の意味。"], ["問二C", "ア", "「[C]性格は違うけれども…」の前後が、俳句の切れ字との共通点。「もちろん」性格は違うけれども、の意味。"], ["問三①", "イ", "「わたくしはァ、○○大学のォ…」のような話し方は、聞いていて「もどかしい」。本文の「話の進みはのろい」「ジリジリする」から。"], ["問三②", "エ", "理由として適当でないもの。本文は「ことばにハニカンでいる」（ア）、「一気に言い切ってしまうことにためらい」（イ）、「たえずブレーキをかけ」（ウ）と述べている。「話の内容を整理して話し出す」（エ）は本文にない。【原本の予想解答は「イ」。本文と照らして「エ」とした。念のため確認】"], ["問四", "ア", "「切れてビミョウにつなげるのが切れ字」。切れ字の働きは「流れを切って詩的緊張を高める」。"], ["問五", "例：「それでサ」の「サ」にも一種の情緒がつきまとうのではないかと考えるから。", "俳句の切れ字には余韻・余情を出す作用がある。若い人の「それでサ」の「サ」も切れ字のように、情緒を添えているのではないかと考える。"], ["問六", "2", "前半（現象の提示）と後半（原因の考察）に分ける問題。原本の予想解答は2。【どこで分けるかは解釈が分かれる。念のため確認】"]]}, {"t": "三 小説（吉野源三郎『君たちはどう生きるか』）", "items": [["問一A", "を", "「こちら[ ]向きました」。向く方向を表す「を」。"], ["問一B", "は", "「コペル君[ ]あっけに取られました」。主題を表す「は」。"], ["問一C", "の", "「エプロン[ ]下からは」。「エプロンの下」と所有・位置を表す「の」。"], ["問二ⓐ", "ア", "「目を丸くする」は「驚く」の意味。"], ["問二ⓑ", "イ", "「たぎる」は「煮立つ」の意味。"], ["問三", "浦川君までエプロンを掛けている", "「あっけに取られた」理由は、直前の「浦川君までエプロンを掛けているじゃありませんか」。15字で抜き出す。"], ["問四", "例：学校を休んだ本当の理由を言えず、困っている気持ち。", "「病気じゃなかったの？」に「もじもじして、なんとも返事しません」。本当の理由（家の手伝い）を言い出せない。"], ["問五", "例：運動事の苦手な浦川君が、長い箸を器用に扱っているから。", "直後に「運動事は何をさせてもカラッ下手な、あの浦川君が、長い箸をこんなに器用に使おうとは」とある。"], ["問六", "場馴れた落ち着き", "「商売人」と感じた様子。直後「プレートに立ったときのような、場馴れた落ち着き」を8字で抜き出す。"], ["問七①", "×", "浦川君の会話文には倒置法はなく、感情をありのままに表した文でもない。【原本の予想解答は○。本文と照らして×とした。念のため確認】"], ["問七②", "×", "1つ目の「へえ！」は「おなかの中で」あげた感嘆で、声に出したものではない。"], ["問七③", "×", "おかみさんは「ゆっくりしているわけにはゆきませんでした」。話し込んではいない。"], ["問七④", "○", "作者の視点から、浦川君・コペル君・店の様子まで詳しく描かれている。"]]}, {"t": "四 古文（狂言『附子』）", "items": [["問一a", "くえ", "「食へ」。語頭以外ではなく、語中の「へ」は現代仮名遣いで「え」→「くえ」。"], ["問一b", "のうのう", "「なうなう」。「ナウ」の古い形で、現代仮名遣いは「のうのう」。"], ["問二", "エ", "狂言の原型は鎌倉時代。鎌倉時代の作品は『徒然草』。枕草子は平安、万葉集は奈良、三国志は中国。"], ["問三", "なくなった", "「附子が皆になった」＝附子がすべてなくなった。"], ["問四", "ア", "「この通り」は、主人の言いつけを破って、毒と言われた砂糖をすべて食べてしまったこと。"], ["問五", "ウ", "次郎が太郎に「この附子を見初めたも食ひ初めたも、皆そちじゃ」と、全部太郎のせいにする作戦。"], ["問六", "例：次郎が、附子を残らず食べてしまったから。", "食べたのは二人とも。それを「よいことをおしゃった」と言ったのは、次郎が残らず食べてしまったことへの皮肉。"]]}], "R2_english": [{"t": "問1 リスニング（絵の説明）", "items": [["No.1〜No.4", "—", "音声・スクリプトが手元にないため、この設問は解説を作成していません。【模範解答も未記入です】"]]}, {"t": "問2 リスニング（対話と質問）", "items": [["No.1〜No.4", "—", "音声・スクリプトが手元にないため、この設問は解説を作成していません。【模範解答も未記入です】"]]}, {"t": "問3 絵を表す単語（並べかえ）", "items": [["(1)", "book", "「本」。o・o・k・b を並べて book。"], ["(2)", "Japanese", "「日本語」。p・J・n・s・a・a・e・e を並べて Japanese。J は大文字。"]]}, {"t": "問4 be動詞の選択", "items": [["(1)", "is", "My name は3人称単数なので is。My name is Taro."], ["(2)", "are not", "We は複数なので are。否定なので are not。"], ["(3)", "were", "Ken and Tom は複数、last year（昨年）があるので過去形 were。"]]}, {"t": "問5 do動詞の選択", "items": [["(1)", "Does", "主語 she は3人称単数。現在の一般動詞の疑問文は Does she ～?"], ["(2)", "Did", "last night（昨夜）があるので過去の疑問文 Did they ～?"]]}, {"t": "問6 語形の選択", "items": [["(1)", "drink", "doesn't の後ろは動詞の原形。「彼女はコーヒーを飲みません」。"], ["(2)", "writing", "now（今）と is から現在進行形。is ＋ ～ing。"], ["(3)", "bought", "yesterday（昨日）があるので過去形。buy の過去形は bought。"], ["(4)", "What", "What a difficult question this is!「なんと難しい質問でしょう」。感嘆文は What a ＋形容詞＋名詞。"]]}, {"t": "問7 誤り探し", "items": [["(1)", "ア", "John は3人称単数なので speak → speaks。"], ["(2)", "ウ", "「これは誰の帽子ですか」「それは私のものです」。me → mine（It's mine.）。"]]}, {"t": "問8 語形変化", "items": [["(1)", "sitting", "「座っている生徒」。名詞 The student を後ろから説明する現在分詞 sitting。"], ["(2)", "painted", "受け身（was ＋過去分詞）。paint－painted－painted。"]]}, {"t": "問9 書きかえ", "items": [["(1)", "cannot", "be able to ～ ＝ can。否定は cannot（can't）。I cannot understand his English."], ["(2)", "watching", "like to watch ＝ like watching（動名詞）。"], ["(3)", "older", "Paul is younger than Taro. ＝ Taro is older than Paul."]]}, {"t": "問10 会話文", "items": [["(1)", "ウ How about some flowers?", "「マイクの誕生日に何を買う？」「花はどう？」「いいね」。"], ["(2)", "ア Of course, I am.", "「今週末サッカーの試合に行く？」「もちろん行くよ。松本山雅FCに所属しているんだ」。"], ["(3)", "ウ Where are the women's shoes?", "店員の May I help you?（いらっしゃいませ）に答え、「3階です」と案内されているので、場所をたずねる文。"]]}, {"t": "問11 並べかえ", "items": [["(1)", "is more popular than baseball", "Soccer is more popular than baseball in Spain. 比較級 more popular than ～。"], ["(2)", "many times have you been", "How many times have you been abroad? 「何回～ですか」＝ How many times。現在完了（経験）。"], ["(3)", "is going to travel", "My sister is going to travel Europe next spring. be going to ～（～する予定だ）。"], ["(4)", "I have a friend who lives", "I have a friend who lives in Hawaii. who lives が a friend を後ろから説明。"]]}, {"t": "問12 電子メール", "items": [["(1)", "イ", "Haru のメールに「Sydney に行って、2週間英語を勉強する」とある。"], ["(2)", "ウ", "Lisa のメールで、「ミートパイ（オーストラリアの食べ物）をランチで食べる」「国立公園でコアラを見る」と提案している。"], ["(3)", "エ", "Haru は「next Sunday, on 19th」にシドニーへ行く。Lisa は26日に時間があり、19日が日曜なら26日も日曜（その1週間後）。【原本の日付：2020年3月19日は実際は木曜日。本文の「Sunday, 19th」に従う】"]]}, {"t": "問13 長文（動物が危険にさらされている理由）", "items": [["(1)", "for years there is little rain", "「何年間もほとんど雨が降らない」。Sometimes for years there is little rain and thirsty animals die... の形。"], ["(2)", "より大きな動物が小さな動物をすべて殺して食べる（そして、より大きな動物も食べ物がなくなって死んでしまう）。", "Bigger animals kill and eat all the small animals を日本語にする。"], ["(3)", "C：people　D：tigers", "「人々はトラを殺す。なぜなら彼らは（トラ）をこわがるから」の流れ。they は People、them は tigers。"], ["(4)", "ウ", "「私たちは動物を私たち自身から守ることができる」の例。動物の毛皮を使った服を着ないようにする。"], ["(5)①", "エ", "本文「Now there are about 6,000.」。"], ["(5)②", "イ", "本文「Some people kill them for their beautiful coats or for medicine.」"]]}], "R2_math": [{"t": "問1 計算", "items": [["(1)", "−4", "3＋(−7)＝3−7＝−4。"], ["(2)", "7/12", "−2/3＋5/4（ひく数がマイナスなのでたす）。通分して −8/12＋15/12＝7/12。"], ["(3)", "−3", "かけ算が先。2×(−4)＝−8。5−8＝−3。"], ["(4)", "−2", "0.4×5＝2。マイナスが1つなので−2。"], ["(5)", "10", "2²＝4。6＋4＝10。"], ["(6)", "−2√2", "√18＝3√2。√2−3√2＝−2√2。"]]}, {"t": "問2 小問集合", "items": [["(1)", "x²＋5x−14", "(x＋7)(x−2)＝x²−2x＋7x−14＝x²＋5x−14。"], ["(2)", "5本", "正五角形の対角線は、1つの頂点から2本ずつ、5×2÷2＝5（本）。"], ["(3)", "x＝4", "5x−3x＝6＋2。2x＝8。x＝4。"], ["(4)", "y＝12/x", "反比例は y＝a/x。x＝2，y＝6 を代入して a＝12。"], ["(5)", "1/3", "3の倍数の目は3と6の2通り。2/6＝1/3。"], ["(6)", "115°", "三角形の外角は、となり合わない2つの内角の和に等しい。x＝39＋76＝115（度）。"]]}, {"t": "問3 資料の整理", "items": [["(1)", "2.5点", "合計は4＋0＋1＋3＋1＋3＋2＋3＋3＋5＝25（点）。25÷10＝2.5（点）。"], ["(2)", "0点1人，1点2人，2点1人，3点4人，4点1人，5点1人", "得点ごとの人数を数える。合計は1＋2＋1＋4＋1＋1＝10（人）。"], ["(3)", "3点", "最頻値は人数がもっとも多い得点。3点が4人でもっとも多い。"]]}, {"t": "問4 素数・平方根・因数分解", "items": [["(1)", "2，3，5，7，11，13", "1と自分自身以外に約数をもたない数（1は素数ではない）。"], ["(2)", "2²×3×13", "156÷2＝78，78÷2＝39，39＝3×13。"], ["(3)", "2√39", "√156＝√(2²×39)＝2√39。"], ["(4)", "39", "156n＝2²×3×13×n が平方数になる最小のn。指数が奇数の3と13をそろえるので n＝3×13＝39。"], ["(5)", "(x−13)(x＋12)", "かけて−156、たして−1になる2数は−13と12。"]]}, {"t": "問5 1次関数と図形", "items": [["(1)", "−2", "y＝3x に(b，−6)を代入。−6＝3b より b＝−2。"], ["(2)", "7", "A(2，6)が y＝−1/2x＋a 上にあるので、6＝−1＋a。a＝7。"], ["(3)", "72", "Dのx座標が2なのでBのx座標も2で、B(2，6)。Cのy座標は6。y＝−1/2x＋13 に y＝6 を代入して x＝14。BC＝14−2＝12，BD＝6。長方形の面積＝12×6＝72。"], ["(4)", "y＝3/8x", "長方形の面積を二等分する直線は、対角線の交点（中心）を通る。中心は B(2，6)とE(14，0)の中点(8，3)。原点と(8，3)を通る直線なので y＝3/8x。"], ["(5)", "5", "D(1，0)なのでB(1，3)。正方形より BD＝BC＝3。C(4，3)。y＝−1/2x＋a に代入して 3＝−2＋a。a＝5。"]]}, {"t": "問6 三角柱", "items": [["(1)", "CF，DF，EF", "辺ABと交わらず平行でもない辺。AD，BE，AC，BCはABと交わり、DEは平行。"], ["(2)", "125/2", "底面積＝5×5×1/2＝25/2。高さAD＝5。体積＝25/2×5＝125/2。"], ["(3)", "125/3", "底面BCFEは1辺5の正方形（BC＝CF＝5）で面積25。DからBCFEまでの高さはAC＝5。1/3×25×5＝125/3。"], ["(4)", "5√2/2", "四面体ABCD＝1/3×(25/2)×5＝125/6。BC⊥CD より △BCD＝1/2×5×5√2＝25√2/2（CD＝5√2）。AH＝3×(125/6)÷(25√2/2)＝5/√2＝5√2/2。"]]}, {"t": "問7 関数 y＝ax²と直線", "items": [["(1)", "16", "y＝2x＋8 に x＝4 を代入。y＝16。"], ["(2)", "(−2，4)", "2x＋8＝−2x より x＝−2，y＝4。"], ["(3)", "1", "A(4，16)が y＝ax² 上にある。16＝a×16。a＝1。"], ["(4)", "24", "y＝2x＋8 とy軸との交点を(0，8)とする。△AOB＝1/2×8×(4＋2)＝24。"], ["(5)", "(−8，−8)", "底辺OBが共通で面積が等しいので、Pは直線AB上でBまでの距離がABと等しい点（Aと反対側）。BはAとPの中点なので P＝2B−A＝(−4−4，8−16)＝(−8，−8)。"]]}], "R2_japanese": [{"t": "一 漢字・文法", "items": [["問一①", "一，二", "一石二鳥。一つの行為で二つの利益を得ること。"], ["問一②", "十，十", "十人十色。人によって考えや好みが違うこと。"], ["問一③", "百，一", "百人一首。"], ["問一④", "二，三", "二人三脚。二人で足を結んで走る競技。協力して物事を行うことのたとえ。"], ["問一⑤", "七，八", "七転八起。何度失敗してもくじけず立ち上がること。"], ["問二①", "イ", "「選ばれた」は「どうした」にあたる述語。"], ["問二②", "ウ", "「昨日京都へ」は「行きました」を詳しくする修飾語。"], ["問二③", "ア", "「兄は」は「だ」に対する主語（「～は」は主語になる）。"], ["問二④", "ウ", "「源氏物語を」は「借りた」を詳しくする修飾語（～を）。"], ["問二⑤", "イ", "「なる」は文末の述語。"], ["問三①", "羽", "羽化（セミが成虫になること）。"], ["問三②", "宇", "宇宙。"], ["問三③", "細", "粘土細工。"], ["問三④", "罪", "犯罪。"], ["問三⑤", "折", "光の屈折。"], ["問三⑥", "雪", "風雪に耐える。「風雪」は風と雪、きびしい試練のたとえ。"], ["問三⑦", "頂", "山の頂上。"], ["問三⑧", "庁", "県庁所在地。"], ["問三⑨", "板", "木の板。"], ["問三⑩", "痛", "傷が痛む。"], ["問四①", "さいてん", "採点。"], ["問四②", "つ", "明かりを点（つ）ける。"], ["問四③", "てんじょう", "天井。"], ["問四④", "いど", "井戸。"], ["問四⑤", "すわ", "座（すわ）る。"], ["問四⑥", "いちざ", "一座。旅芸人の「一座」。"], ["問四⑦", "はいご", "背後。"], ["問四⑧", "せ", "背（せ）が伸びる。"], ["問四⑨", "にわ", "庭を掃除する。「庭」の訓読みは「にわ」。"], ["問四⑩", "ていえん", "庭園。"]]}, {"t": "二 論説文「ハンバーガーの世紀」（ジョシュ・オザースキー）", "items": [["問一a", "新鮮", "「シンセン」は新鮮。"], ["問一b", "よち", "余地。"], ["問一c", "誇", "「ホコリ」は誇り。「誇」。"], ["問一d", "はんせん", "帆船。"], ["問一e", "心臓", "「シンゾウ」は心臓。"], ["問二A", "イ", "【A】の前後は「牛肉を好む」と「牛肉がもっとも貧しい都市住民にまで行きわたる…」。前の内容に事柄を加えて続けているので「そして」。"], ["問二B", "ウ", "「いささか大げさに、【B】正確に述べているように」。大げさだが正確だ、と逆の内容をつなぐので「だが」。"], ["問二C", "ア", "「【C】、家でつくるなら何でもないことだ。だが…」。いったん認めておいて「だが」と続くので「もちろん」。"], ["問三", "健康と繁栄の類なき象徴", "「豊かな恵みの象徴」は、牛肉を「健康と繁栄の類なき象徴」と見なしたことを言い換えている。11字。"], ["問四", "アメリカ人は昔から牛肉を好み、その豊富さを誇ってきたこと。", "オースティン・フリント博士とリチャード・ヘンリー・デーナーの著書は、どちらもアメリカ人が牛肉を好み、牛肉の豊富さを愛国的な誇りにしてきたことを示すために引用されている。"], ["問五", "万人が最も好む牛肉の部分を、わずかなお金で手に入れられる確実な方法だから。", "本文の「万人がもっとも好むものでできているから」「ほぼ同じものがわずかなお金で手に入る」「牛肉の好きな部分を残らず、安く食べるもっとも確実な方法」をまとめる。35〜40字なので37字。別解可（字数に注意）。"], ["問六", "牛肉を食べる経験に共通する特質", "⑤以下「たっぷりの肉、牛肉らしさ、ジューシーな脂肪など」は、直前の「牛肉を食べる経験に共通する特質」の具体例。15字。"], ["問七", "エ", "ハンバーグ・ステーキは標準化され、商品化され、アメリカ人の金儲けの手段となって、普遍的なアメリカの食物となった。"], ["問八", "ウ", "本文では、最初は手順が複雑だったが、標準化されてはじめて誰もが同じ手順で調理できるようになったとある。「登場したときから誰もが手軽に…」は誤り。（当てはまらないものを選ぶ問題）"]]}, {"t": "三 随筆「生還」（小林信彦）", "items": [["問一A", "私は", "「利き腕が右、と私は書いた」。述語「書いた」の主語。"], ["問一B", "イメージが", "「頭に浮かんだイメージが…激しく変化してゆく」。"], ["問一C", "彼女は", "「彼女は私の病状をメモしていたくらいだから…見ていた」。"], ["問二イ", "ウ", "「そらんじて」は暗唱して。"], ["問二ロ", "ア", "「いいところで見えましたね」は客が来たことを言うので「来た」。"], ["問二ハ", "エ", "「可能だろうと見た」は「判断した」。"], ["問三", "左利きの人", "「おれは左利きだ、どうしてくれる、という人が出てくる」。「おれ」は読者のうちの左利きの人。"], ["問四", "初めに頭の／わってくる", "「初めに頭の中に浮かんだ文章と微妙に変わってくる」から。始めの五字「初めに頭の」、終わりの五字「わってくる」。"], ["問五", "文体", "「それが文体ということになるのではなかろうか」。"], ["問六", "出版界をよく知り、出版社に在籍していたから。", "「出版界をよく知っている彼女」「出版社に在籍する彼女」を用いてまとめる（25字以内）。例：「出版界をよく知り、出版社に在籍していたから。」21字。"], ["問七", "「週刊文春", "「文芸春秋に関してだけでそういう結論になり」。その内容は直前の「『週刊文春』の連載を続けるのは無理だが、『文芸春秋』の方の五枚半は可能だろう」で、その始めの五字。【念のため確認：かぎかっこも1字に数えます】"], ["問八X", "オ", "「脳がすさまじい早さで動くからである。（X）、脳と右手が密接に連絡をとり合っている幸せな状態」。前の内容を言い換えているので「つまり」。"], ["問八Y", "ウ", "「（Y）、脳が早く動くのは、記憶力によって貯めこまれた…からなのだ」。前の内容に補足を加えるので「もっとも」。"]]}, {"t": "四 古文「方丈記」", "items": [["問一a", "つたえきく", "「伝へ聞く」。語頭以外の「へ」は「え」。"], ["問一b", "あわれみ", "「憐れみ」は古文では「あはれみ」。語中の「は」は「わ」に直して「あわれみ」。"], ["問一c", "おさめたまう", "「治め給ふ」。「給ふ」は「たまう」。"], ["問一d", "みたまう", "「見給ふ」。"], ["問一e", "ふたとせ", "「二年」は「ふたとせ」と読む。"], ["問二", "民を恵み、世を助け給ふによりてなり", "「これ、民を恵み、世を助け給ふによりてなり」。昔の賢い天子が、軒をととのえず煙の乏しさを見て税を軽くした理由。17字程度。"], ["問三", "イ", "「よからぬ事ども」は悪いことども、「うち続きて」は相次いで、「五穀ことごとくならず」は五穀がまったく実らなかった。"], ["問四", "エ", "『方丈記』の作者は鴨長明。ア清少納言『枕草子』、イ紫式部『源氏物語』、ウ小林一茶『おらが春』、オ兼好『徒然草』。"]]}]};const T={"R7": [{"t": "問10 制服か私服か（生徒4人の意見）", "lines": [["Mike", "We are very busy every morning, / so we don't have much time / to choose our clothes. / First, / if I choose school uniform, / I don't have to think / what to wear. / Second, / I think / it looks better, / and gives a better impression / than my clothes. / Also / it may be useful / to know / how to put on a tie and so on / when I start to work / after graduation.", "私たちは忙しい／毎朝／だから／私たちはあまり時間がない／服を選ぶための／第一に／もし私が制服を選ぶなら／私は考えなくてよい／何を着るか／第二に／私は思う／それはより良く見える／そして与える／より良い印象を／私の服よりも／また／それは役に立つかもしれない／知っておくことは／ネクタイの結び方を／など／私が働き始めるとき／卒業後に"], ["Jane", "I want to be a designer. / I've been interested in fashion / for two years, / and studied styles / which were nice for me / in magazines. / So I have many clothes. / When the school admits clothes / that each person wants to wear, / I can express who I am. / However, / we have to be careful / how we look like, / not only at school / but also out of school.", "私はデザイナーになりたい／私はファッションに興味を持ってきた／2年間／そして研究した／スタイルを／私に合う／雑誌で／だから私は多くの服を持っている／学校が認めるとき／服を／それぞれの人が着たい／私は表現できる／私が誰なのかを／しかし／私たちは気をつけなければならない／私たちがどう見えるかに／学校でだけでなく／学校の外でも"], ["Mary", "I agree with wearing their own clothes. / I'm so happy / if we can choose / school uniforms / or our own clothes / to school. / Even if we are allowed to wear our own clothes, / some students want to wear a school uniform. / It's important / that each student can decide / which to wear / depending on the weather, / season, / situation, / and so on.", "私は賛成だ／自分の服を着ることに／私はとてもうれしい／もし私たちが選べるなら／制服を／または自分の服を／学校に着る／たとえ自分の服を着ることが許されても／制服を着たい生徒もいる／大切だ／それぞれの生徒が決められることが／どちらを着るか／天気に応じて／季節／状況／など"], ["Jack", "I have an older brother / who graduated from high school. / I want to go to the same school / which he graduated. / The rule of his school is / that they must wear a school uniform. / It is so expensive. / If I wear the same school uniform, / my parents will be glad. / It leads to saving money.", "私には兄がいる／高校を卒業した／私は同じ学校に行きたい／彼が卒業した／彼の学校のルールは／彼らは制服を着なければならないというもの／それはとても高い／もし私が同じ制服を着れば／私の両親は喜ぶだろう／それはお金を節約することにつながる"]]}, {"t": "問11 図書館便り（健とスミス先生の会話）", "lines": [["Ms. Smith", "Hi, Ken. / What are you doing?", "こんにちは、健／あなたは何をしていますか"], ["Ken", "Hello, Ms. Smith. / I'm making the Library News / for next month.", "こんにちは、スミス先生／私は図書館便りを作っています／来月の"], ["Ms. Smith", "What is the topic / for September?", "話題は何ですか／9月の"], ["Ken", "I will ask some teachers and students / to write about a book / they like the best. / Ms. Smith, / do you like reading books?", "私は何人かの先生と生徒に頼むつもりです／本について書くように／彼らがいちばん好きな／スミス先生／あなたは読書が好きですか"], ["Ms. Smith", "{{(2)①:Of course.}} / I can't imagine my life / without books. / My friends call me a bookworm.", "もちろん／私は想像できません／私の生活を／本なしの／友だちは私を本の虫と呼びます"], ["Ken", "A bookwo…? / What does it mean?", "本の虫…？／それはどういう意味ですか"], ["Ms. Smith", "It's a little living thing / that eats books. / But it also means a person / who likes reading very much.", "それは小さな生き物です／本を食べる／でも、それは人のことも意味します／読書がとても好きな"], ["Ken", "I see. / Could you write something / about the book / which you recommend to us / for the next Library News?", "なるほど／何か書いていただけませんか／本について／あなたが私たちにすすめる／次の図書館便りのために"], ["Ms. Smith", "OK. / I have many books / I love to read. / It is difficult to choose one. / Oh, / I read \"TOTTO-CHAN, The Little Girl at the Window.\" / This book is translated into 35 languages / and is read all over the world. / I read it in English. / Did you read it in Japanese?", "いいですよ／私は多くの本を持っています／読むのが大好きな／1冊を選ぶのは難しい／そうだ／私は『窓ぎわのトットちゃん』を読みました／この本は35の言語に翻訳されています／そして世界中で読まれています／私は英語で読みました／あなたは日本語で読みましたか"], ["Ken", "No, / but I watched it as an animated movie / last year. / Was the English version difficult?", "いいえ／でも私はアニメ映画として見ました／昨年／英語版は難しかったですか"], ["Ms. Smith", "Yeah, / it was a little difficult. / {{(3)並べかえ:It is a wonderful book written by Tetsuko Kuroyanagi.}} / She wrote it in 1981. / She is a very popular Japanese TV personality, / an actor and an essayist. / She is interested in welfare and peace. / She also served as a UNICEF Goodwill Ambassador.", "ええ／少し難しかったです／それは素晴らしい本です／黒柳徹子によって書かれた／彼女はそれを1981年に書きました／彼女はとても人気のある日本のテレビタレントです／俳優でありエッセイストでもある／彼女は福祉と平和に興味があります／彼女はユニセフ親善大使も務めました"], ["Ken", "I know. / But she was expelled from elementary school / because she was restless.", "知っています／でも彼女は小学校から追い出されました／落ち着きがなかったので"], ["Ms. Smith", "That's right. / In her new school, Tomoe Gakuen, / she met children / with various problems, / disabilities / and sad experiences. / Totto-chan, / Tetsuko's nickname, / and other children learned from each other, / grew, / and developed their individualities / by always working together.", "その通りです／新しい学校、トモエ学園で／彼女は子どもたちに出会いました／さまざまな問題を持つ／障害／そして悲しい経験／トットちゃん／徹子のニックネーム／そして他の子どもたちは互いから学び／成長し／そして個性を伸ばしました／いつも一緒に活動することで"], ["Ken", "Sounds nice. / It's true that {{(4):everyone is different and everyone is good.}}", "いいですね／本当ですね／みんな違って、みんないい"], ["Ms. Smith", "Tomoe's principal, Mr. Kobayashi, / repeatedly told her / \"You are really a good girl, you know.\" / He said this, / even if she did something different and strange. / {{(5):Those words}} continued to shine / like jewels / in Totto-chan's mind.", "トモエの校長先生、小林先生は／何度も彼女に言いました／「君は本当はいい子なんだよ」／彼はこう言いました／たとえ彼女が変わったおかしなことをしても／その言葉は輝き続けました／宝石のように／トットちゃんの心の中で"], ["Ken", "I really want to read this book. / Please show me the English version.", "私はこの本をぜひ読みたいです／英語版を見せてください"], ["Ms. Smith", "Sure. / I want many students to know / that {{(6):reading is fun.}} / Books teach us many good things.", "もちろん／私は多くの生徒に知ってほしい／読書は楽しいということを／本は私たちに多くのよいことを教えてくれる"], ["Ken", "{{(2)⑤:I think so, too.}} / I enjoyed talking with you today.", "私もそう思います／私は今日あなたと話して楽しかったです"], ["Ms. Smith", "Me, too. / Good luck.", "私もです／がんばってね"]]}], "R4": [{"t": "問10 ダックスフンドの会話文", "lines": [["A", "Do you know a \"dachshund\"?", "あなたは知っていますか／ダックスフンドを"], ["B", "Yes, I do. / It's a kind of German dogs / {{(1)A:that has short legs.}}", "はい、知っています／それはドイツの犬の一種です／足が短い"], ["A", "That's right. / But it was also the name / of an American food.", "その通りです／でもそれは名前でもありました／アメリカの食べ物の"], ["B", "Oh, really? / I didn't know it. / Please tell me about it.", "へえ、本当に／私は知りませんでした／それについて教えてください"], ["A", "In 1871, / a German introduced this food / to the United States. / {{(2)B:}} / He called it a \"dachshund\", / and sold it at his shop.", "1871年に／あるドイツ人がこの食べ物を紹介しました／アメリカに／彼はそれをダックスフンドと呼びました／そして自分の店で売りました"], ["B", "How many \"dachshunds\" did he sell?", "何本のダックスフンドを彼は売りましたか"], ["A", "He sold thousands every year. / Many Americans liked to eat them / because they were good and easy to eat, / and became more and more popular / all over the United States.", "彼は毎年何千も売りました／多くのアメリカ人が食べるのを好みました／それらがおいしくて食べやすかったので／そしてますます人気になりました／アメリカ中で"], ["B", "{{(2)C:}} / Is it still popular now?", "今でもまだ人気がありますか"], ["A", "Yes, it is. / But, in 1901, / the name was changed.", "はい／でも1901年に／名前が変えられました"], ["B", "Why was it changed then?", "なぜそのとき変えられたのですか"], ["A", "At a ballpark, / food venders were selling \"dachshunds\" / and saying, / \"They're red hot!\" / Then, / a writer wrote the news about it, / but he didn't know the spelling of \"dachshund.\"", "野球場で／食べ物の売り子がダックスフンドを売っていました／そして言っていました／熱々だよ／すると／ある記者がそれについての記事を書きました／でも彼はダックスフンドの綴りを知りませんでした"], ["B", "Really? / What did he do?", "本当に／彼はどうしましたか"], ["A", "So, / he gave it a new name. / It is still used by everyone today. / {{(2)D:}} / Of course, you know.", "それで／彼はそれに新しい名前をつけました／それは今でもみんなに使われています／もちろん／あなたは知っています"], ["B", "I wonder what it is. / What is the name?", "私は何だろうと思います／その名前は何ですか"], ["A", "OK, I'll tell you. / It is \"{{(3)E:Hot dog}}.\"", "いいですよ／教えます／それは「ホットドッグ」です"]]}, {"t": "問11 健人の説明文", "lines": [["健人", "Hi, / I will tell you about this town / and around our houses. / First, / I want you to know the place of supermarket. / This is the big store in this town. / So you can get many goods / which you want.", "こんにちは／私はあなたに話します／この町について／そして私たちの家の周りについて／最初に／私はあなたに知ってほしい／スーパーの場所を／これはこの町で大きな店です／だからあなたはたくさんの品物を手に入れられます／あなたが欲しい"], ["健人", "Second, / you may usually go to station / because the station is near our houses. / If you use trains many times, / you should check the time / when trains leave.", "2つ目に／あなたはたぶんよく駅へ行くでしょう／駅は私たちの家の近くにあるので／もしあなたが何度も電車を使うなら／あなたは時間を確認するべきです／電車が出発する"], ["健人", "But there are some problems. / There is not a hospital in this town. / You have to go to the next town / to see a doctor. / It takes about 20 minutes / from this town by car. / And there is not a park. / Children don't have the place / to play soccer, baseball, basketball, and so on.", "でもいくつか問題があります／この町には病院がありません／あなたは隣の町へ行かなければなりません／医者に診てもらうために／約20分かかります／この町から車で／そして公園がありません／子どもたちには場所がありません／サッカー、野球、バスケットボールなどをする"], ["健人", "Do you have any questions?", "何か質問はありますか"]]}, {"t": "問12 トーマスの話", "lines": [["地の文", "Thomas was a high school student / who loved music. / He had friends / who didn't have experience / of playing instruments. / They liked to listen to his songs / because he was good at playing the instruments and singing. / He wanted to become a great musician. / He had the idea: / musicians had to be \"VERY\" good / at playing instruments. / He was always thinking / about the way to play instruments very well / and practiced them every day. / However, / a bad thing happened to him.", "トーマスは高校生でした／音楽が大好きな／彼には友達がいました／経験がない／楽器を演奏した／彼らは彼の歌を聞くのが好きでした／彼は楽器を演奏することと歌うことが上手だったので／彼は偉大なミュージシャンになりたかった／彼には考えがありました／ミュージシャンはとても上手でなければならない／楽器を演奏するのが／彼はいつも考えていました／楽器をとても上手に演奏する方法を／そして毎日それらを練習しました／しかし／悪いことが彼に起こりました"], ["地の文", "One day, / he was walking to school / and listening to music. / He didn't realize / that a car appeared from a corner. / So the car hit him, / and he fell down on the road / and injured his arms. / He was taken to the hospital, / and the doctor said, / \"you may not be able to play instruments anymore.\" / He thought / that his dream was broken. / His friends couldn't believe the news. / They visited him in the hospital. / He talked calmly / but he looked so sad / and it seemed / that he didn't want to think of music. / After his friends saw Thomas, / they wanted to cheer him up. / One of the friends said, / \"What can we do for Thomas?\" / After a while, / another friend said, / \"I have an idea / Thomas will be surprised at.\" / They thought / that it was very nice / and said, / \"Let's do it!\"", "ある日／彼は学校へ歩いていました／そして音楽を聞いていました／彼は気づきませんでした／車が角から現れたことに／それで車が彼にぶつかりました／そして彼は道路に倒れました／そして腕をけがしました／彼は病院へ運ばれました／そして医者は言いました／あなたはもう楽器を演奏できないかもしれません／彼は思いました／自分の夢がこわれたと／彼の友達はその知らせを信じられませんでした／彼らは病院で彼を訪ねました／彼は穏やかに話しました／でもとても悲しそうに見えました／そして思われました／彼は音楽のことを考えたくないように／友達はトーマスに会ったあと／彼らは彼を元気づけたいと思いました／友達の一人が言いました／トーマスのために私たちは何ができるだろう／しばらくして／別の友達が言いました／私には考えがある／トーマスが驚くような／彼らはそれはとてもいいと思いました／そして言いました／それをやろう"], ["地の文", "One month later, / Thomas came back to school. / His friends said to him, / \"We want to show you one thing after school. / Come to the gym!\" / Thomas went there after school. / There were his classmates and their teacher. / His friends were ready / to play instruments on the stage. / {{(2):He was surprised.}} / His friends said to him, / \"We are ready to play instruments / but we need a singer today. / {{(3):Could you sing a song we practiced?}}\" / He cried / because he felt their warming-friendship. / After he finished crying, / he sang a song / from the bottom of his heart. / Their performance was not so good, / but everyone thought / that it was the best song / they ever listened to. / Thomas felt / he had good friends / and that it's \"VERY\" important / not only to be good at playing instruments / but also to think about others too. / Thomas and his friends decided / to form a band.", "1か月後／トーマスは学校に戻りました／友達は彼に言いました／放課後に君に見せたいものがある／体育館に来て／トーマスは放課後にそこへ行きました／彼のクラスメートと先生がいました／友達は準備ができていました／ステージで楽器を演奏する／彼は驚きました／友達は彼に言いました／私たちは楽器を演奏する準備ができている／でも今日は歌う人が必要だ／私たちが練習した歌を歌ってくれませんか／彼は泣きました／彼らの暖かい友情を感じたので／泣き終わったあと／彼は歌を歌いました／心の底から／彼らの演奏はあまり上手ではありませんでした／でもみんな思いました／それは最高の歌だと／今まで聞いた／トーマスは感じました／よい友達がいると／そして「とても」大切だと／楽器を演奏するのが上手なだけでなく／他人を思いやることも／トーマスと友達は決めました／バンドを結成すると"], ["地の文", "Ten years later, / the band became famous around the world. / Thomas and his friends send a lot of people / their songs / which cheer them up.", "10年後／そのバンドは世界中で有名になりました／トーマスと友達は多くの人々に送っています／彼らの歌を／それが彼らを元気づける"]]}], "R3": [{"t": "問13 水と人体／海の生き物", "lines": [["本文（あ）", "The human body contains lots of water. / Our body is about 70% water. / Our brain is about 85% water / and our bones are about 33% water. / {{(1):Water is very important for the human body.}} / We can live for four weeks without food, / but {{(1):we can't live for more than about three days without water!}}", "人間の体は含む／たくさんの水を／私たちの体は約70%が水です／私たちの脳は約85%が水／そして私たちの骨は約33%が水です／水は人間の体にとてもだいじです／私たちは4週間生きられる／食べ物なしで／しかし／私たちは約3日より長くは生きられない／水なしでは"], ["本文（あ）", "We need to drink about eight glasses of water every day. / We need to drink even more water / when we play sports / and when it's hot. / We need water / because it keeps our blood healthy. / Our blood is about 50% water. / {{(2):Blood takes food to different parts of our body.}} / {{(2):It takes oxygen from our lungs to other parts of our body, too.}}", "私たちは飲む必要がある／約8杯の水を／毎日／私たちはさらにもっと多くの水を飲む必要がある／私たちがスポーツをするとき／そして暑いとき／私たちは水が必要です／それが私たちの血液を健康に保つから／私たちの血液は約50%が水です／血液は食べ物を運ぶ／私たちの体のいろいろな部分に／それは酸素を運ぶ／私たちの肺から／私たちの体の他の部分へ／もまた"], ["海の生き物", "Lots of animals live in the water. / Some {{(6):animals}} live in salt water. / They live in seas and oceans. / The biggest ocean animal is {{(4):the blue whale}}. / It can be more than 30 meters long / and 200 metric tons. / It eats very small ocean animals / called krill. / It can eat 4 metric tons of krill in a day! / {{(5):Blue whales live in most of the oceans.}}", "たくさんの動物が住んでいる／水の中に／いくつかの動物は住んでいる／塩水の中に／それらは住んでいる／海と大洋に／一番大きな海の動物は／シロナガスクジラです／それは30メートル以上の長さになることがある／そして200メートルトン／それはとても小さな海の動物を食べる／オキアミと呼ばれる／それは1日に4メートルトンのオキアミを食べることができる／シロナガスクジラは住んでいる／大洋のほとんどに"], ["海の生き物", "Many other {{(6):animals}} live in salt water. / There are sharks / and lots of other fish. / All ocean animals need water. / Water gives them food and oxygen. / Jellyfish are not fish — / they are invertebrates. / They don't have a skeleton. / They need water / to support their bodies.", "たくさんの他の動物が住んでいる／塩水の中に／サメがいる／そしてたくさんの他の魚／すべての海の動物は水が必要です／水は彼らに食べ物と酸素を与える／クラゲは魚ではない／彼らは無脊椎動物です／彼らは骨格を持たない／彼らは水が必要です／支えるために／彼らの体を"]]}], "R2": [{"t": "問12 電子メール（HaruとLisa）", "lines": [["Haru", "Dear Aunt Lisa, / How are you? / I'm going to go to Sydney / next Sunday, on 19th / and stay there for two weeks / {{(1):to study English.}} / It will be my first stay in Sydney. / During my stay, / I want to see you / if you have time. / When is good for you?", "親愛なるリサおばさん／お元気ですか／私はシドニーへ行くつもりです／来週の日曜、19日に／そしてそこに2週間滞在します／英語を勉強するために／それは私の初めてのシドニー滞在です／滞在の間／私はあなたに会いたいです／もしあなたに時間があれば／いつがあなたにとって都合がいいですか"], ["Lisa", "Dear Haru, / Thank you for your e-mail. / I have time on 26th. / Will you be free on that day? / I know a good café restaurant, / so let's have lunch there. / {{(2):It has a meat pie.}} / It's really good. / Do you know a meat pie? / It's very popular here. / I hope you like it. / Also, / {{(2):I want to go to the national park / to watch koalas with you.}} / They are very cute. / We can take pictures with them. / What do you want to do? / I'm looking forward to seeing you soon.", "親愛なるハル／メールをありがとう／私は26日に時間があります／あなたはその日は空いていますか／私はいいカフェレストランを知っています／だからそこで昼食を食べましょう／そこにはミートパイがあります／それは本当においしいです／あなたはミートパイを知っていますか／それはここではとても人気です／あなたが気に入るといいです／また／私は国立公園へ行きたい／あなたとコアラを見るために／それらはとてもかわいいです／私たちはそれらと写真を撮れます／あなたは何をしたいですか／すぐ会えるのを楽しみにしています"]]}, {"t": "問13 動物が危険にさらされている理由（トラ）", "lines": [["本文", "Why are animals in danger? / In 1900 / there were 100,000 tigers in the world. / {{(5)①:Now there are about 6,000.}} / In India, / there were about 30,000 tigers, / and the number is now 2,000. / You could find eight different kinds of tiger / in different countries then. / Now there are only five kinds. / We are never going to see the other three again.", "なぜ動物は危険な状態にあるのか／1900年に／世界に10万頭のトラがいた／今は約6,000頭いる／インドでは／約3万頭のトラがいた／そしてその数は今2,000頭です／8種類の違うトラを見つけることができた／違う国々で／当時／今はたった5種類しかいない／私たちは他の3種類を二度と見ることはない"], ["本文", "The tiger is the biggest animal in the cat family. / Siberian tigers are sometimes 320 kilograms. / They need trees, water, and other animals for food. / The tiger is a beautiful animal, / but it is disappearing. / Why is it disappearing? / And why are other species disappearing / from our world?", "トラはネコ科でいちばん大きな動物です／シベリアのトラは時々320キログラムです／彼らは木、水、そして他の動物が必要です／食べ物のために／トラは美しい動物です／しかしそれは消えつつあります／なぜそれは消えつつあるのですか／そしてなぜ他の種も消えつつあるのですか／私たちの世界から"], ["本文", "Animals are always in danger / from changes in the natural world. / Sometimes {{(1):for years there is little rain}} / and thirsty animals die / because they cannot find water. / {{(2):Bigger animals kill and eat all the small animals,}} / and then the bigger animals die, / because they have no more food. / The natural world changes, / and animals cannot always change with it.", "動物はいつも危険にある／自然界の変化から／時々何年も雨がほとんど降らない／そしてのどのかわいた動物が死ぬ／彼らが水を見つけられないので／より大きな動物がすべての小さな動物を殺して食べる／そしてそれからより大きな動物も死ぬ／彼らにはもう食べ物がないから／自然界は変わる／そして動物はいつもそれと一緒に変わることはできない"], ["本文", "But today, / animal species are disappearing faster. / Now humans are the biggest danger to animals. / Think about tigers again. / People kill them / because {{(3)C:they}} are afraid of {{(3)D:them}}. / {{(5)②:Some people kill them / for their beautiful coats / or for medicine.}} / Other people kill them / because they like hunting big animals. / Or they kill all the smaller animals, / and then the tigers cannot find any food. / People cut down the trees, too, / and take away their habitat. / In all these ways, / tigers are in danger from humans.", "しかし今日／動物の種はもっと速く消えつつある／今や人間が動物へのいちばん大きな危険です／もう一度トラについて考えなさい／人々はそれらを殺す／彼らがそれらをこわがるから／ある人々は殺す／それらの美しい毛皮のために／または薬のために／他の人々はそれらを殺す／彼らが大きな動物を狩るのが好きだから／または彼らはすべてのより小さな動物を殺す／そしてそれからトラは食べ物を見つけられない／人々は木も切り倒す／そして彼らの生息地を奪う／これらすべての方法で／トラは人間から危険にさらされている"], ["本文", "But the problem is not just about tigers. / About 1 percent of the animals in the world / disappear every year / because humans are killing them. / We cannot always protect animals from nature, / but {{(4):we can protect them from us.}}", "しかし問題はトラだけについてではない／世界の動物の約1パーセントが／毎年消える／人間がそれらを殺しているから／私たちはいつも動物を自然から守ることはできない／しかし私たちはそれらを私たち自身から守ることができる"]]}]};
const E1=[["R7", "令和７年度"], ["R4", "令和４年度"], ["R3", "令和３年度"], ["R2", "令和２年度"]];

function esc(t){return t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
/* 分数を縦表示に */
const TOK="(?:\\d+(?:\\.\\d+)?(?:√\\d+)?[a-zℓπ]?²?|[a-zℓπ]|√\\d+)";
const NUMP="(?:\\(([^()\\n]{1,40})\\)|(?<![A-Za-z0-9.ℓπ])("+TOK+")(?![A-Za-z]))";
const DENP="(?:\\(([^()\\n]{1,40})\\)|(\\d+(?:\\.\\d+)?(?:√\\d+)?[a-zℓπ]?²?|[a-zℓπ]|√\\d+)(?![A-Za-z0-9]))";
const FR=new RegExp(NUMP+"/"+DENP,"g");
function fr(t){return t.replace(FR,(m,p1,n1,p2,d1)=>{const n=p1||n1,d=p2||d1;
 if(!/[0-9√π]/.test(n+d)) return m;
 if(/\d[a-z]$/.test(n)&&/^[a-z]$/.test(d)) return m;
 if(p1&&!/[0-9a-zπ√ℓ]/.test(p1)) return m;
 return "<span class='fr'><span>"+n+"</span><span>"+d+"</span></span>"})}
function hint(t){return t.replace(/\{\{([^:}]*):([\s\S]*?)\}\}/g,(m,l,x)=>"<mark class='h'>"+x+"<sup>"+l+"</sup></mark>")}
function rich(t){return fr(esc(t))}
function slash(t){return hint(esc(t).replace(/\s*\/\s*/g,"<span class='sl'>／</span>"))}
function draw(){
 for(const [id,L,c,lb] of [["e1",E1,"S","年度"]]){

   b.onclick=()=>{e=k;open=false;save();draw();scrollTo(0,0)};el.appendChild(b)}}
 const el=document.getElementById("ss");el.innerHTML="";
 for(const [k,n] of S){const b=document.createElement("button");b.textContent=({math:"🔢 ",english:"🔤 ",science:"🔬 ",social:"🌏 ",japanese:"📖 "})[k]+n;b.className="s-"+k+(k===s?" on":"");
  b.onclick=()=>{s=k;open=false;save();draw();scrollTo(0,0)};el.appendChild(b)}

 m.style.setProperty("--acc",AC[0]);m.style.setProperty("--accl",AC[1]);m.style.setProperty("--acct",AC[2]);
 let h="<div class='cur'>"+FULL[e]+" ／ "+S.find(a=>a[0]===s)[1]+"</div>";
 if(!D[e+"_"+s])h+="<p class='legend'>令和７年度は英語・数学のみ公開しています。</p>";
 for(const sec of (D[e+"_"+s]||[])){
  const no=(sec.t.match(/^問\d+/)||[""])[0];
  const tr=(s==="english"&&T[e])?T[e].find(x=>(x.t.match(/^問\d+/)||[""])[0]===no&&no):null;
  if(sec.t){h+="<h2>"+esc(sec.t)+"</h2>";
   if(tr){const o=opened[e+no];h+="<button class='s-english tg"+(o?" on":"")+"' data-k='"+e+no+"'>"+(o?no+" 英文和訳確認 ▲とじる":no+" 英文和訳確認")+"</button>";
    if(o){h+="<div class='legend'>スラッシュ（／）で区切った英文と日本語訳です。<mark class='h'>黄色</mark>はヒント（<mark class='h'>…<sup>(設問番号)</sup></mark>）です。</div><div class='tr'><h3>"+esc(tr.t)+"</h3>";
     for(const [sp,en,ja] of tr.lines){h+="<div class='ln'><div class='en'><span class='sp'>"+esc(sp||"")+"</span>"+slash(en)+"</div><div class='ja'>"+slash(ja||"")+"</div></div>"}
     h+="</div>"}}}
  for(const [q,a,x] of sec.items){h+="<div class='it'><div class='q'>"+esc(q)+"</div>"+(a&&a!=="—"?"<div class='a'>答："+rich(a)+"</div>":"")+"<div class='e'>"+rich(x)+"</div></div>"}
  if(sec.t)h+="<div style='text-align:right'><button class='top' onclick='window.scrollTo({top:0,behavior:\"smooth\"})'>⬆ トップにもどる</button></div>"}
 h+="<p class='note'>※模範解答・解説は、原本に解答がないため問題を解いて作成したものです。リスニング（問1・問2）は音声・スクリプトがないため未作成です。【念のため確認】と書いた箇所は、先生にもご確認ください。</p>";
 m.innerHTML=h;
 m.querySelectorAll("button.tg").forEach(b=>b.onclick=()=>{const k=b.dataset.k;opened[k]=!opened[k];const y=scrollY;draw();scrollTo(0,y)});
}
function save(){try{localStorage.setItem("sh_sel2",JSON.stringify([e,s]))}catch(_){}}
addEventListener("scroll",()=>{document.getElementById("fab").style.display=scrollY>300?"block":"none"});
