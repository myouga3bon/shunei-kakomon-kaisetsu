<style>
.kx-blk{margin:6px 0;padding:6px 10px 6px 10px;border-radius:10px;white-space:normal;line-height:1.7}
.kx-lb{display:inline-block;font-size:.74rem;font-weight:800;color:#fff;border-radius:999px;padding:1px 10px;margin:0 6px 3px 0;vertical-align:1px}
.kx-miru{background:#eef6ff;border-left:5px solid #3b7dd8}.kx-miru .kx-lb{background:#3b7dd8}
.kx-konkyo{background:#f1f8ff;border-left:5px solid #5aa0e6}.kx-konkyo .kx-lb{background:#5aa0e6}
.kx-toku{background:#fafafa;border-left:5px solid #888}.kx-toku .kx-lb{background:#777}
.kx-toku ol{margin:2px 0 0 0;padding-left:1.6em}.kx-toku li{margin:2px 0}
.kx-chigau{background:#fff6f6;border-left:5px solid #e57373;padding:4px 10px}.kx-chigau summary{display:inline-block;cursor:pointer;list-style:none;font-size:.82rem;font-weight:800;color:#c0392b;background:#fff;border:2px solid #e57373;border-radius:999px;padding:3px 14px;margin:2px 0;user-select:none}.kx-chigau summary::-webkit-details-marker{display:none}.kx-chigau summary::before{content:'▶ ';font-size:.75em}.kx-chigau[open] summary::before{content:'▼ '}.kx-chigau[open] summary{background:#e57373;color:#fff}
.kx-chigau ul{margin:2px 0 0 0;padding-left:0;list-style:none}.kx-chigau li{margin:2px 0}
.kx-chigau li::before{content:"✕ ";color:#e57373;font-weight:800}
.kx-miss{background:#fff8ec;border-left:5px solid #f0a030}.kx-miss .kx-lb{background:#e08a10}
.kx-oboeru{background:#fffbe0;border:2px solid #f2c200;border-radius:10px}.kx-oboeru .kx-lb{background:#d9a800}
.kx-ob{list-style:none;margin:4px 0 0;padding:0}.kx-ob li{margin:4px 0;padding:4px 8px;background:#fff;border:1.5px dashed #f2c200;border-radius:8px;line-height:1.6}
.kx-obk{color:#8a5a00}.kx-ar{color:#e08a10;font-weight:800;margin:0 3px}
.kx-fig{margin:6px 0;text-align:center}.kx-fig img{max-width:100%;max-height:340px;border:1px solid #ddd;border-radius:8px;background:#fff}
.kx-p{white-space:normal;line-height:1.7;margin:4px 0}
.kx-kakunin{background:#f3f3f3;border-left:5px solid #9e9e9e;font-size:.88em;color:#555}.kx-kakunin .kx-lb{background:#9e9e9e}
.kc-r{color:#d62828;font-weight:800}
.kc-b{color:#1f5fbf;font-weight:800}
.kc-y{background:linear-gradient(transparent 45%,#ffe866 45%);padding:0 1px;color:inherit}
</style>
<script>
/* 解説テキストの書き方（1行の「解説」欄の中に書く）
   【見る】着眼点  【根拠】本文・資料の手がかり  【解く】手順1 ▶ 手順2 ▶ …
   【ちがう】イ：理由 ▶ ウ：理由（押すと開くボタンで表示）  【ミス】よくある間違い  【覚える】覚える1行（書けるときだけ）  【確認】念のため確認（原本と照合できない答えなど）  【図】ファイル名.png
   色：!!答え・結論!!（赤） ^^根拠・手がかり^^（青） ==覚える用語==（黄マーカー）  ※1設問2か所まで
   印がない解説は、これまでどおりそのまま表示する。 */
const KX_LB={"見る":["miru","ここを見る"],"根拠":["konkyo","根拠"],"解く":["toku","解き方"],"ちがう":["chigau","ほかの選択肢がちがう理由"],"ミス":["miss","よくある間違い"],"覚える":["oboeru","覚える1行"],"確認":["kakunin","念のため確認"]};
function kcol(h){return h.replace(/!!(.+?)!!/g,"<b class='kc-r'>$1</b>").replace(/\^\^(.+?)\^\^/g,"<b class='kc-b'>$1</b>").replace(/==(.+?)==/g,"<mark class='kc-y'>$1</mark>")}
function kob(s){let h=kcol(rich(s.trim()));h=h.replace(/^([^＝<]{1,14})＝/,"<b class='kx-obk'>$1</b>＝");return h.replace(/→/g,"<span class='kx-ar'>→</span>")}
function muz(t){const m=(t||"").match(/^\s*【(かなりムズ|ムズ)】/);return m?"<span class='muz"+(m[1]==="かなりムズ"?" k":"")+"'>"+m[1]+"！</span>":""}
function kx(t){if(t)t=t.replace(/^\s*【(?:かなりムズ|ムズ)】\s*/,"");return kx0(t)}
function kx0(t){
 if(!t)return "";
 const R=s=>kcol(rich(s.trim()));
 if(t.indexOf("【")<0)return R(t);
 const parts=t.split(/(?=【(?:見る|根拠|解く|ちがう|ミス|覚える|確認|図)】)/);
 let h="";
 for(const p of parts){
  const m=p.match(/^【(見る|根拠|解く|ちがう|ミス|覚える|確認|図)】([\s\S]*)$/);
  if(!m){if(p.trim())h+="<div class='kx-p'>"+R(p)+"</div>";continue}
  const k=m[1],b=m[2].trim();if(!b)continue;
  if(k==="図"){for(const f of b.split(/\s*[,、，]\s*/))if(f)h+="<figure class='kx-fig'><img loading='lazy' src='fig/"+esc(f)+"' alt='解説の図'></figure>";continue}
  const [c,lb]=KX_LB[k];let body;
  if(k==="解く"){const st=b.split(/\s*▶\s*/).filter(Boolean);body=st.length>1?"<ol>"+st.map(s=>"<li>"+R(s)+"</li>").join("")+"</ol>":R(b)}
  else if(k==="ちがう"){h+="<details class='kx-blk kx-chigau'><summary>ほかの選択肢がちがう理由</summary><ul>"+b.split(/\s*▶\s*/).filter(Boolean).map(s=>"<li>"+R(s)+"</li>").join("")+"</ul></details>";continue}
  else if(k==="覚える"){const ls=b.split(/\s*[／▶]\s*/).filter(Boolean);body=ls.length>1?"<ul class='kx-ob'>"+ls.map(s=>"<li>"+kob(s)+"</li>").join("")+"</ul>":kob(b)}
  else body=R(b);
  h+="<div class='kx-blk kx-"+c+"'><span class='kx-lb'>"+lb+"</span>"+body+"</div>";
 }
 return h;
}
</script>
<!-- /KX -->

<script>
const D={"R7_english": [{"t": "問1 リスニング（絵の説明）", "items": [["No.1〜No.4", "—", "【確認】音声・スクリプトが手元にないため、解説と模範解答は作成していません。"]]}, {"t": "問2 リスニング（対話と質問）", "items": [["No.1〜No.4", "—", "【確認】音声・スクリプトが手元にないため、解説と模範解答は作成していません。"]]}, {"t": "問3 絵を表す単語（並べかえ）", "items": [["(1)", "chair", "【見る】絵を見て英語の単語を思い出し、ならべかえた文字でつくります。【解く】絵は「いす」。英語で chair。 ▶ 文字 i・c・r・a・h をならべて c-h-a-i-r。（余分な文字には線が引いてあります）【覚える】chair＝いす"], ["(2)", "window", "【見る】絵はカーテンのついた「窓」。英語で window。【解く】文字 d・i・w・n・w・o を並べて w-i-n-d-o-w。【覚える】window＝窓"], ["(3)", "shoes", "【見る】絵は「くつ」。2つで1組なので shoes と s がつく。【解く】文字 o・s・e・s・h を並べて s-h-o-e-s。【ミス】複数形の s を忘れない。"]]}, {"t": "問4 be動詞・do動詞の選択", "items": [["(1)", "Do", "【見る】文を見て、be動詞（am/is/are）かdo動詞（do/does/did）かを決めます。【解く】「you have a pen?」→「あなたはペンを持っていますか」。have は一般動詞なので、疑問文は !!Do!! でつくる。【覚える】一般動詞の疑問文：Do ＋ 主語 ＋ 動詞？"], ["(2)", "is", "【見る】Mr. Yamada は「1人の男の人（3人称単数）」。be動詞は is。【解く】「ヤマダ先生は先生です」＝ Mr. Yamada !!is!! a teacher.【覚える】I→am、you・複数→are、he／she／it・1人1つ→is。"], ["(3)", "Did", "【見る】last year（昨年）があるので、過去のこと。【解く】一般動詞 live の疑問文なので、過去は Did。「～しましたか」＝ !!Did!! ＋ 主語 ＋ 動詞の原形？"], ["(4)", "am", "【見る】主語が I のときのbe動詞は am。【解く】I am Kana.「私はカナです」。 ▶ 残りの an / are / does / do は使わない。"]]}, {"t": "問5 英文の書きかえ", "items": [["(1)", "He is sixteen years old.", "【見る】主語を I から He に変えます。【解く】I am → He is。それ以外の語は変えない。 ▶ He is sixteen years old.（彼は16歳です）"], ["(2)", "She has a book.", "【見る】主語を She（彼女）に変える。3人称単数のとき、have は has になる。【解く】She has a book.（彼女は本を持っています）"], ["(3)", "He can run fast.", "【見る】can（～できる）を加える。can のあとの動詞は必ず「原形（s のつかない形）」。【解く】runs → run。 ▶ He can run fast.（彼は速く走ることができます）"]]}, {"t": "問6 ほぼ同じ内容の書きかえ", "items": [["(1)", "will", "【見る】意味が同じ言い方に直す。【解く】be going to ～（～するつもり）＝ will ～。 ▶ I am going to read ＝ I will read。w で始まる語は !!will!!。"], ["(2)", "listening", "【見る】like to ～（～するのが好き）＝ like ～ing。【解く】like to listen ＝ like listening。l で始まる語は !!listening!!。"]]}, {"t": "問7 並べかえ", "items": [["(1)", "How long have you used your pencil case?", "【見る】日本語の意味から語順を決める。「どのくらい（長く）使っていますか」＝ How long have you used ～?【解く】How long ＋ have ＋ 主語 ＋ 過去分詞 ～?（期間をたずねる現在完了） ▶ How long have you used your pencil case?（その筆箱をどのくらい使っていますか）"], ["(2)", "The dog sleeping under the tree is mine.", "【見る】「木の下で寝ている犬」→ the dog の後ろに sleeping under the tree をつける。【解く】「～している○○」を後ろから説明するときは ～ing ＋ 語句 を名詞の後ろに置く。 ▶ The dog sleeping under the tree is mine.（木の下で寝ている犬は私のです）"], ["(3)", "I don't understand why you need a new bike.", "【見る】「なぜあなたが新しい自転車が必要なのか」＝ why you need a new bike。【解く】why のあとは「主語＋動詞」の順（疑問文の語順にしない）。 ▶ I don't understand why you need a new bike."]]}, {"t": "問8 対話文の空所補充", "items": [["(1)", "ア", "【見る】対話の前後を見て、あてはまる文を選ぶ。【解く】相手が「駅への行き方」をたずねているので、答えは「この道を行ってください」のような道案内の !!ア!!。【ちがう】イ：I'd like to go there tomorrow.（明日そこへ行きたい）は道の説明ではない ▶ ウ：Look at this shop.（この店を見て）は行き方を答えていない ▶ エ：No, thank you.（いいえ、けっこうです）は断るときの言葉"], ["(2)", "エ", "【見る】Aが「テニスです（I like tennis.）」と答えているので、直前の質問は「どのスポーツが好きですか」の エ。【解く】答えから質問を考える。【ちがう】ア：「あなたはもっとサッカーを練習しなければならない」では、Aの Tennis is. につながらない ▶ イ：When ～?（いつ）と聞かれたら、時を答える ▶ ウ：I don't know.（わかりません）では会話が続かない"]]}, {"t": "問9 英作文・地図", "items": [["(1)(a)", "例：She is using a smartphone.", "【見る】条件「is を使う」→ 現在進行形（is ＋ ～ing）で書く。【解く】絵の女の子がしていること：スマホを使っている。 ▶ She is using a smartphone.【覚える】絵を見て「だれが・何をしているか」を文にする。"], ["(1)(b)", "例：He is drinking water.", "【見る】条件「文頭に He」。男の子が水を飲んでいる絵。【解く】He is drinking water."], ["(1)(c)", "例：He is writing a letter.", "【見る】条件「a letter を使う」。男の子が手紙を書いている絵。【解く】He is writing a letter."], ["(2)①", "on the left", "【見る】地図を見て、場所を説明する。ホテルは映画館の左側にある。【解く】「～の左に」＝ !!on the left!! of ～。"], ["(2)②", "behind", "【見る】公園は病院の後ろ（向こう側）にある。【解く】「～の後ろに」＝ !!behind!! ～。"], ["(2)③", "between", "【見る】パン屋は美術館と書店の間にある。【解く】「AとBの間に」＝ !!between!! A and B。"]]}, {"t": "問10 制服か私服か（長文）", "items": [["(1)", "Mike，Jack", "【見る】質問をしっかり読んで、本文から探す。制服に賛成なのはだれか。【解く】Mike：I choose school uniform の理由を述べている（何を着るか考えなくてよい）。→ 制服に賛成。 ▶ Jack：兄と同じ制服で、親が喜ぶ。→ 制服に賛成。 ▶ Jane・Mary は自分の服を着たい（私服）。 ▶ 答えは !!Mike，Jack!!。"], ["(2)", "Mary", "【見る】私服に賛成の人のうち、「制服か私服か自分で選べる」と言っているのはだれか。【解く】Mary は It's important that each student can decide which to wear（どちらを着るか決められることが大切）と言っている。 ▶ Jane は「自分らしさを表したい」と言っている。だから答えは !!Mary!!。"], ["(3)", "例：I agree with Mike because I do not have to think about what to wear every morning.", "【見る】条件は「I agree with ～ で始め、名前と理由を10語以上で書く」。【解く】賛成する人の名前を選ぶ（Mike など）。 ▶ その人の理由を本文から探す（朝、何を着るか考えなくていい）。 ▶ I agree with Mike because ～ の形でつなぐ。 ▶ 例のように、理由は本文の言葉を使えばよい。"]]}, {"t": "問11 図書館便り（長文）", "items": [["(1)", "ア", "【見る】本文全体の話題を考える。健は「好きな本について書いてもらう」企画の準備をしている。【解く】だから題名は What Is Your Favorite Book?（あなたの好きな本は？）の !!ア!!。【ちがう】イ：スミス先生と黒柳徹子さんの話は一部分だけ ▶ ウ：bookworm（本の虫）は会話の中の1つの言葉にすぎない ▶ エ：アニメ映画の話は健が少しふれただけ"], ["(2)①", "エ", "【見る】健が Do you like reading books?（読書は好きですか）と聞いて、スミス先生が答えている。【解く】答えるときの「もちろん」＝ Of course.（!!エ!!）。【ちがう】ア：I think so, too.（私もそう思います）は意見に賛成するときの言葉で、⑤で使う ▶ イ：Yes, it really was.（はい、本当にそうでした）は過去のことを聞かれたときの答え ▶ ウ：Oh, that's sad.（それは悲しい）は話に合わない"], ["(2)⑤", "ア", "【見る】先生が「本は私たちに多くのよいことを教えてくれる」と言ったあと、健が賛成している。【解く】「私もそう思います」＝ I think so, too.（!!ア!!）。【ちがう】イ：Yes, it really was.（はい、本当にそうでした）は過去のことへの答え ▶ ウ：Oh, that's sad.（それは悲しい）は「読書は楽しい」という話に合わない ▶ エ：Of course.（もちろん）は質問への答えで、①で使う"], ["(3)", "It is a wonderful book written by Tetsuko Kuroyanagi.", "【見る】日本語は「それは黒柳徹子さんによって書かれた素晴らしい本です」。【解く】It is a wonderful book の後ろに written by ～（～によって書かれた）をつけて book を説明する。 ▶ It is a wonderful book written by Tetsuko Kuroyanagi."], ["(4)", "みんな違って、みんないい。", "【見る】英文を、なるべく言葉のとおり日本語にする。【解く】everyone is different＝みんな（だれもが）違っている／and everyone is good＝そして、みんな（だれもが）よい。 ▶ →「!!みんな違って、みんないい。!!」"], ["(5)", "ウ", "【見る】Those words（それらの言葉）は、直前の文の言葉を指す。【解く】直前：校長先生が何度も言った「You are really a good girl, you know.（君は本当はいい子なんだよ）」。 ▶ これを指しているものを選ぶ → !!ウ!!。【ちがう】ア：the Library News（図書館便り）は言葉ではない ▶ イ：I love to read（私は読むのが大好き）は校長先生の言葉ではない ▶ エ：to shine like jewels（宝石のようにかがやく）は、言葉がどうなったかの説明"], ["(6)", "Reading is fun.", "【見る】スミス先生の言葉 I want many students to know that reading is fun. から、3語の部分を探す。【解く】that のあとの reading is fun。文の頭なので大文字で Reading is fun."], ["(7)", "イ，エ", "【見る】本文の内容と合っている文を選ぶ。【解く】イ：トットちゃんは落ち着きがなく、小学校を退学させられた（was expelled from elementary school）。→ 合っている ▶ エ：校長先生の言葉は、トットちゃんの心の中で宝石のようにかがやき続けた。→ !!合っている!!【ちがう】ア：健とスミス先生は話をしただけで、一緒に本を読んではいない ▶ ウ：みんなで一緒に学んだ（always working together）と書いてある ▶ オ：健は「この本をぜひ読みたい」と言っている【確認】選択肢イは「トモエ学園で」退学させられた、と書いてありますが、本文では退学させられたのは前の小学校で、そのあとトモエ学園に入っています。本文と少しずれるので、原本の模範解答もご確認ください。"], ["(8)①", "Thank you for", "【見る】お礼の言葉。「素晴らしい本をありがとうございました」＝ Thank you for the wonderful book.【解く】「～をありがとう」＝ !!Thank you for!! ～。"], ["(8)②", "to show", "【見る】「友だちに見せたい本がたくさん」＝ a lot of books to show my friends。【解く】to show（見せるための）が books をうしろから説明している。 ▶ 「～するための○○」＝ ○○ ＋ to ＋ 動詞の原形。"]]}], "R7_math": [{"t": "問1 計算・小問集合", "items": [["(1)①", "−8", "【見る】同じ符号（−と−）のたし算は、数字だけをたして、共通の符号をつけます。【解く】(−2)＋(−6)＝−(2＋6)＝!!−8!!。【覚える】−2と−6は、どちらも「借金」。借金が2円と6円なら、あわせて8円の借金（−8）。"], ["(1)②", "−7", "【見る】2つに分けて計算します。【解く】−2⁴ は「2⁴（2を4回かける）＝16 にマイナスをつけたもの」なので −16。 ▶ (−3)² は (−3)×(−3)＝＋9。 ▶ −16＋9＝!!−7!!。【ミス】−2⁴ と (−2)⁴ はちがいます。かっこがあるときだけ、マイナスも一緒にかけます。"], ["(1)③", "4", "【見る】かけ算をさきに計算します。【解く】0.8×(−2)＝−1.6。 ▶ 2.4−(−1.6)。マイナスのマイナスはプラスなので、2.4＋1.6＝!!4!!。【覚える】「−(−)」は「＋」にかわる。"], ["(1)④", "−1/4", "【見る】分母をそろえます（通分）。【解く】−3/4 は分母が4のまま、1/2 は 2/4 になおす。 ▶ −3/4＋2/4＝(−3＋2)/4＝!!−1/4!!。"], ["(1)⑤", "4√3", "【見る】√27 は小さくできます。√の中を √3 にそろえてからたします。【解く】27＝9×3。9＝3×3 なので、3が√の外に出る → √27＝3√3。 ▶ √3＋3√3 は、文字式の x＋3x＝4x と同じ計算 → (1＋3)√3＝!!4√3!!。【覚える】√の中が同じ＝文字と同じようにたせる（x＋3x＝4x）／√の中がちがう＝たせない（√2＋√3 はこのまま）"], ["(1)⑥", "−4x＋5", "【見る】かっこをはずします。【解く】(x−2)−(5x−7) ▶ −( )の前のマイナスは、かっこの中の符号をぜんぶ逆にします。 ▶ ＝x−2−5x＋7 ▶ 文字（x）と数字を分けてまとめる。x−5x＝−4x、−2＋7＝5。 ▶ 答え：!!−4x＋5!!。"], ["(2)", "500a＋10b", "【見る】金額＝1枚の値段×枚数。【解く】500円玉がa枚 → 500×a＝500a（円）。 ▶ 10円玉がb枚 → 10×b＝10b（円）。 ▶ あわせて !!500a＋10b!!（円）。"], ["(3)", "135°", "【見る】多角形の内角の和は 180°×(n−2)（nは辺の数）。【解く】八角形なので n＝8。180×(8−2)＝180×6＝1080°。 ▶ 正八角形は8つの角がすべて同じ大きさなので、1080÷8＝!!135°!!。"], ["(4)", "±0.4", "【見る】「2乗して0.16になる数」を探します。【解く】0.4×0.4＝0.16。 ▶ (−0.4)×(−0.4)も0.16なので、答えは 0.4 と −0.4 の2つ。【覚える】平方根は「プラスとマイナスの2つ」。±0.4 と書く。"], ["(5)", "x＝−2，9", "【見る】因数分解（かけ算の形にする）を使います。【解く】「かけて−18、たして−7」になる2つの数を探す。−9と＋2（−9×2＝−18、−9＋2＝−7）。 ▶ (x−9)(x＋2)＝0。 ▶ かけて0になるのは、どちらかが0のとき。x−9＝0 または x＋2＝0 なので、x＝9，−2。"]]}, {"t": "問2 データの活用", "items": [["(1)", "9", "【見る】平均＝合計÷個数。【解く】無所属の6回分をたす。5＋0＋7＋22＋8＋12＝54。 ▶ 6回なので 54÷6＝!!9!!。"], ["(2)", "中央値272、四分位範囲100", "【解く】まずデータを小さい順に並べます：119，191，260，284，291，294（6個）。 ▶ 中央値：個数が偶数のときは、真ん中2つ（260と284）の平均。(260＋284)÷2＝272。 ▶ 四分位範囲：データを前半3個と後半3個に分けて、それぞれの中央値を出します。 ▶ 前半 119，191，260 の中央値＝191（第1四分位数） ▶ 後半 284，291，294 の中央値＝291（第3四分位数） ▶ 四分位範囲＝第3−第1＝291−191＝100。"], ["(3)", "箱ひげ図（最小21，第1四分位数24，中央値30，第3四分位数32，最大35）", "【見る】5つの数（最小・第1・中央・第3・最大）を求めて、図にします。【解く】D党を小さい順に並べる：21，24，29，31，32，35。 ▶ 最小＝21、最大＝35 ▶ 中央値＝真ん中2つの平均 (29＋31)÷2＝30 ▶ 前半 21，24，29 の中央値＝24（第1四分位数） ▶ 後半 31，32，35 の中央値＝32（第3四分位数） ▶ かき方：24から32までの「箱」をかき、30のところに縦線。箱から21と35まで「ひげ」をのばす。"], ["(4)", "F党（理由は例）", "【解く】例：F党は小さい順に0，1，2，2，2，7で、中央値と第3四分位数がどちらも2になり、箱が書きやすいから。 ▶ F党のデータを小さい順に並べて、5つの数を調べます。理由はデータの数字を使って書ければOKです。【確認】記述なので、データに基づく理由が書けていればよい。原本の採点基準もご確認ください。"]]}, {"t": "問3 規則性", "items": [["(1)", "25枚", "【見る】図の枚数を順に見て、きまりを見つけます。【解く】1番目…1枚、2番目…4枚（2×2）、3番目…9枚（3×3）。 ▶ 「n番目は、たてn枚×よこn枚」とわかります。 ▶ 5番目＝5×5＝!!25枚!!。"], ["(2)", "n²", "【解く】n番目は、たてがn枚、よこがn枚のならびなので、n×n＝!!n²!!（枚）。"], ["(3)", "10番目", "【見る】(2)の式 n²＝100 になる n を探します。【解く】10×10＝100 なので、n＝10。!!10番目!!です。"], ["(4)", "n＝1013", "【見る】「n番目と(n−1)番目の枚数の差」を式にします。【解く】n番目：n² 、(n−1)番目：(n−1)²。 ▶ 差＝n²−(n−1)²＝n²−(n²−2n＋1)＝2n−1。 ▶ これが2025なので 2n−1＝2025。 ▶ 2n＝2026、!!n＝1013!!。"]]}, {"t": "問4 関数", "items": [["(1)", "A(−4，−8)，B(2，−2)", "【見る】点AとBのxの値を、直線の式 y＝x−4 に入れて、yを求めます。【解く】A：x＝−4 のとき y＝−4−4＝−8 → A(−4，−8) ▶ B：x＝2 のとき y＝2−4＝−2 → B(2，−2)"], ["(2)", "6√2", "【見る】ABの長さは、直角三角形をつくって三平方の定理を使います。【解く】xの差：2−(−4)＝6、yの差：−2−(−8)＝6。 ▶ AB²＝6²＋6²＝72。AB＝√72＝!!6√2!!。【覚える】√72＝√(36×2)＝6√2。"], ["(3)", "a＝−1/2", "【見る】y＝ax² が点B(2，−2)を通るので、x＝2，y＝−2 を入れます。【解く】−2＝a×2²＝4a ▶ a＝−2÷4＝−1/2。"], ["(4)", "16", "【見る】まず点Cを求めます。Cは直線とx軸の交点なので y＝0。【解く】0＝x−4 より x＝4。C(4，0)。 ▶ △OACの底辺を OC（x軸上）と考えると、底辺＝4。高さは点Aのy座標の大きさ＝8。 ▶ 面積＝4×8÷2＝!!16!!。"], ["(5)", "3倍", "【見る】△OABを「大きい三角形−小さい三角形」で考えます。【解く】△OBC：底辺OC＝4、高さ＝Bのyの大きさ2 → 4×2÷2＝4。 ▶ △OAB＝△OAC−△OBC＝16−4＝12。 ▶ 12÷4＝3（倍）。"]]}, {"t": "問5 折り返し・合同の証明", "items": [["(1)", "70°", "【見る】折り返すと、点Bは点Dに重なります。△ADEに注目します。【解く】∠Aは長方形の角なので90°。∠ADE＝20°。 ▶ 三角形の角の和は180°なので、∠DEA＝180°−90°−20°＝!!70°!!。"], ["(2)", "10cm", "【見る】折り返した辺の長さは等しい。【解く】BE＝DE＝7cm。 ▶ AB＝AE＋EB＝3＋7＝10cm。 ▶ 長方形は向かい合う辺が等しいので、CD＝AB＝!!10cm!!。"], ["(3)ア", "GD", "【見る】長方形の向かい合う辺は等しいので AD＝BC。【解く】BCを折り返してできた辺が GD なので BC＝GD。 ▶ よって AD＝!!GD!!。"], ["(3)イ", "GDF", "【ムズ】【見る】∠ADE＋∠EDF＝90°（もとの角）、∠GDF＋∠EDF＝90°。【解く】どちらも「90°−∠EDF」なので、∠ADE＝∠!!GDF!!。"], ["(3)ウ", "1組の辺とその両端の角", "【見る】合同条件を選びます。【解く】AD＝GD（辺）、∠DAE＝∠DGF（角）、∠ADE＝∠GDF（角）。 ▶ 「1つの辺」と「その両はしの2つの角」が等しい → !!1組の辺とその両端の角!!がそれぞれ等しい。"]]}, {"t": "問6 おうぎ形・円", "items": [["(1)", "30°", "【解く】∠AOB＝90°を3つに等分しているので、90°÷3＝!!30°!!。"], ["(2)", "25π/12", "【見る】おうぎ形の面積＝円の面積×(中心角÷360)。【解く】半径5の円の面積＝π×5²＝25π。 ▶ 中心角30°なので 25π×30/360＝!!25π/12!!。"], ["(3)", "25π/12", "【かなりムズ】【見る】斜線部分は形が複雑なので、^^面積の等しい三角形^^を使って、おうぎ形に置きかえる。【解く】斜線部分＝（おうぎ形ORS）＋（△OSQ）−（△ORP） ▶ △ORPと△SOQは、OR＝OS（半径）、∠ORP＝∠SOQ＝30°、直角があるので合同 → 面積が等しい ▶ だから 斜線部分＝おうぎ形ORS ▶ ∠ROS＝30°なので、(2)と同じ !!25π/12!!【覚える】形が複雑な面積は、等しい部分を足したり引いたりして、知っている形に置きかえる。"]]}], "R4_english": [{"t": "問1 リスニング（絵の説明）", "items": [["No.1〜No.4", "—", "【確認】音声・スクリプトが手元にないため、解説と模範解答は作成していません。"]]}, {"t": "問2 リスニング（対話と質問）", "items": [["No.1〜No.4", "—", "【確認】音声・スクリプトが手元にないため、解説と模範解答は作成していません。"]]}, {"t": "問3 絵を表す単語（並べかえ）", "items": [["(1)", "book", "【見る】絵は「本」。英語で book。【解く】文字 o・k・o・b を並べて b-o-o-k。【覚える】book＝本"], ["(2)", "apple", "【見る】絵は「りんご」。英語で apple。【解く】文字 e・p・l・a・p を並べて a-p-p-l-e。【覚える】apple＝りんご"]]}, {"t": "問4 be動詞の選択", "items": [["(1)", "am", "【見る】主語を見て be動詞を選ぶ。主語が I のときは am。【解く】I !!am!! Kumi.（私はクミです）。【覚える】I→am、he／she／it・1人1つ→is、you・複数→are。"], ["(2)", "is", "【見る】Mr. Yamada は「1人の男の人」＝3人称単数。be動詞は is。【解く】Mr. Yamada !!is!! ～.（ヤマダさんは～です）。"]]}, {"t": "問5 do動詞の選択", "items": [["(1)", "Do", "【見る】now（今）の文なので現在。一般動詞の疑問文。【解く】主語 you には Do を使う。!!Do!! you have a pet now?（あなたは今ペットを飼っていますか）。"], ["(2)", "Does", "【見る】主語 she は3人称単数。現在の一般動詞の疑問文は Does ＋ 主語 ＋ 動詞の原形？【解く】!!Does!! she ～?"], ["(3)", "Did", "【見る】last year（昨年）があるので過去。過去の疑問文は Did ＋ 主語 ＋ 動詞の原形？【解く】!!Did!! you ～ last year?"]]}, {"t": "問6 並べかえ", "items": [["(1)", "He goes to the library after school.", "【見る】日本語から語順を決める。「彼は放課後、図書館へ行く」。【解く】主語 He ＋ 動詞 goes（3人称単数なので go に es）。 ▶ go to ～（～へ行く）。after school（放課後）は文の最後に。 ▶ He goes to the library after school."], ["(2)", "My mother was making dinner then.", "【見る】「そのとき作っていた」＝ 過去進行形「was／were ＋ ～ing」。【解く】My mother was making dinner then.（そのとき母は夕食を作っていました）"], ["(3)", "I have never been to Hokkaido.", "【見る】「行ったことがない」＝ 現在完了（経験）の否定。【解く】have never been to ～＝～へ行ったことがない。 ▶ I have never been to Hokkaido."], ["(4)", "She is going to go shopping on this weekend.", "【見る】「～する予定だ」＝ be going to ＋ 動詞の原形。「買い物に行く」＝ go shopping。【解く】She is going to go shopping on this weekend.（彼女は今週末に買い物に行く予定です）"], ["(5)", "It is fine today, isn't it?", "【見る】付加疑問文は、文の最後に「ね？」にあたる言葉を付ける。【解く】It is ～ のとき → isn't it?。肯定の文のあとは否定の形を付ける。"]]}, {"t": "問7 対話文の空所補充", "items": [["(1)", "イ", "【見る】「ペンはどこ？」と場所をたずねられている。【解く】場所を答えている文は、「机の下を見て」の !!イ!!。【ちがう】ア：「はい。たぶん彼女は行くでしょう」は場所を答えていない ▶ ウ：「窓を開けてくれますか」はお願いで、答えになっていない ▶ エ：「英語の歌に興味がありますか」は話が変わっている"], ["(2)", "エ", "【見る】「中華料理を食べたことある？」の返事を選ぶ。【解く】「もちろん。大好き」の !!エ!! が自然で、後ろの文ともつながる。【ちがう】ア：「それは私には難しい」では、あとの「よく中華料理店に行きます」とつながらない ▶ イ：「いいえ。私は日本に住んでいます」は No なので、あとの文と合わない ▶ ウ：「私は毎日ハンバーガーを食べます」は中華料理の話になっていない"], ["(3)", "ウ", "【見る】「私は一生懸命勉強するために学校へ行く。あなたは？」と聞かれている。【解く】「私もよ。いっしょに勉強しよう」の !!ウ!! が、前後の流れに合う。【ちがう】ア：「なぜならあなたはひまだから」は理由の文で、How about you?（あなたはどう？）の答えにならない ▶ イ：「本当？私はそう思わない」では、Aの That's great.（すばらしい）につながらない ▶ エ：「私たちは英語の教科書を持ってくる必要はない」は話が変わっている"]]}, {"t": "問8 絵を見て英語で答える", "items": [["(1)", "例：He is cooking in the kitchen.", "【見る】絵を見て「だれが・何を・どこで」を英語にする。台所で料理をしている絵。【解く】He is cooking in the kitchen.（現在進行形） ▶ 条件：3語以上で書く。"], ["(2)", "例：I don't like rice.", "【見る】男の子がご飯を前にして、いやそうな顔をしている。【解く】I の後につながる2語以上の文 → I don't like rice.（ご飯が好きではありません）"], ["(3)", "例：You can't take pictures.", "【見る】撮影禁止のマーク。「写真をとってはいけません」。【解く】You can't take pictures.（can't または don't を使う）"], ["(4)", "例：He is going to have lunch.", "【見る】予定表を見る。11時に英語の勉強、次は12時に昼食。【解く】He is going to have lunch.（彼は昼食を食べる予定です）"]]}, {"t": "問9 自己紹介文", "items": [["①", "am from", "【見る】メモを見て、文をつくる。「長野出身」＝ I am from Nagano.【解く】（　）に入るのは !!am from!!。"], ["②", "I like to play the piano.", "【見る】メモに the piano とあるので「ピアノをひくのが好き」。【解く】I like to play the piano.（like playing でも可）"], ["③", "for ten years", "【見る】「10年間」＝ for ten years。【解く】I have played the piano !!for ten years!!.（10年間ピアノをひいています）"], ["④", "I will try the guitar next year.", "【見る】メモの the guitar を使う。「来年はギターに挑戦するつもり」。【解く】I will try the guitar next year.（I'm going to try ～ でも可）"]]}, {"t": "問10 ダックスフンドの会話文", "items": [["(1)A", "ア", "【見る】dachshund（ダックスフンド）はドイツ生まれの犬で、足が短いのが特徴。【解く】空所に入るのは「足が短い」→ that has short legs の !!ア!!。【ちがう】イ：「私たちが学校に持っていかなければならない」は犬の説明ではない ▶ ウ：「私たちが海の中を見ることができる」は意味が通らない ▶ エ：「飛ぶことができる」犬はいない"], ["(2)", "C", "【見る】But I've never heard the food name.（でも私はその食べ物の名前を聞いたことがありません）は、^^話を聞いている側（B）^^が言う言葉。【解く】( B )と( D )は、説明しているAのセリフの中にある ▶ ( C )だけがBのセリフの中にある ▶ Cに入れると「でもその食べ物の名前は聞いたことがない。今も人気があるの？」と自然につながる → !!C!!【ちがう】B：説明しているAのセリフの中なので入らない ▶ D：これもAのセリフの中なので入らない"], ["(3)E", "イ", "【見る】dachshund が今の名前としてみんなに使われているもの → 食べ物の名前 Hot dog。【解く】空所に入るのは !!イ!!。【ちがう】ア：Pizza（ピザ）▶ ウ：Hamburger（ハンバーガー）▶ エ：Ice cream（アイスクリーム）は、どれも「熱々の（red hot）ダックスフンド」から名前がついたものではない"]]}, {"t": "問11 健人の町の説明", "items": [["(1)", "biggest", "【見る】下線部①の big は「この町でいちばん大きな店」の意味。【解く】「いちばん～」は最上級。big の最上級は !!biggest!!（gを重ねて est）。"], ["(2)", "エ", "【見る】本文では、スーパーは「欲しいものが手に入る」大きな店。【解く】健人はスーパーが役に立つと考えている → !!エ!!。【ちがう】ア：「駅の近くに本屋はない」→ 地図では駅のとなりに本屋がある ▶ イ：「この町には公園がある」→ 本文に there is not a park とある ▶ ウ：健人は郵便局の話をしていない"], ["(3)", "ウ", "【見る】「^^最もふさわしくない^^もの」を選ぶ問題。健人は最後に Do you have any questions?（何か質問はありますか）と聞いている。【解く】健人の話した問題は「病院がない」「公園がなく、サッカーなどをする場所がない」こと ▶ ウ「もっとスポーツ用品が必要ですか」は、場所がないという話とずれている → !!ウ!!【ちがう】ア：「ありがとう。質問があればまた聞きます」は自然なお礼 ▶ イ：「どこでサッカーをすればいいですか」は公園がない話につながる質問 ▶ エ：「この町にハンバーガー屋はないのですか」は町について聞く質問として成り立つ【確認】エも話とは関係が薄いので、原本の模範解答もご確認ください。"]]}, {"t": "問12 トーマスの話", "items": [["(1)", "who", "【見る】「～する高校生」「～がない友達」のように、人を後ろから説明している。【解く】人のあとにつく関係代名詞は !!who!!。"], ["(2)", "友達がステージで楽器を演奏する準備をしていたこと。", "【見る】下線部②の「なぜそう思ったか」の理由は、直前の文に書いてある。【解く】直前の文を読んで、「友達がステージで楽器を演奏する準備をしていたこと」を日本語でまとめる。"], ["(3)", "私たちが練習した曲を歌ってくれませんか。", "【見る】Could you ～? は「～してくれませんか」（ていねいなお願い）。【解く】the song we practiced は「私たちが練習した曲」（we practiced が song を説明）。"], ["(4)", "イ", "【見る】話全体のテーマを考える。友達の思いやりで立ち直る話。【解く】タイトルは The Importance of Friends（友達の大切さ）の !!イ!!。【ちがう】ア：Giving up Dream（夢をあきらめること）→ トーマスは最後にバンドで有名になった ▶ ウ：The Skill of Singing（歌の技術）→ 演奏はうまくなかったが最高の歌だった、という話 ▶ エ：Be Careful His Life（彼の命に気をつけて）→ 事故は話のきっかけにすぎない"], ["(5)", "例：I remember the school trip. My friends and I enjoyed the beach very much.", "【見る】条件は「2文以上、10語以上、主語と動詞のある文」。【解く】思い出に残っていることを1つ決める（修学旅行など）。 ▶ 1文目で「何か」、2文目で「どうだったか」を書く。"]]}], "R4_math": [{"t": "問1 計算", "items": [["(1)", "6", "【見る】−3＋9 は、9から3をひくイメージ。【解く】9−3＝!!6!!。プラスの数のほうが大きいので答えはプラス。"], ["(2)", "−9.6", "【解く】まず数字だけかけ算。1.2×8＝9.6。 ▶ 符号：マイナスが1つだけ → 答えはマイナス。!!−9.6!!。"], ["(3)", "−1/14", "【見る】分母をそろえる（通分）。分母は2と7の最小公倍数14。【解く】3/7＝6/14、1/2＝7/14。 ▶ 6/14−7/14＝!!−1/14!!。"], ["(4)", "8/25", "【見る】わり算は「逆数（分母と分子を入れかえた数）をかけるかけ算」にする。【解く】−8/15÷(−5/3)＝−8/15×(−3/5)。 ▶ 符号：マイナス×マイナス＝プラス。 ▶ 約分：(8×3)/(15×5)＝24/75。÷3して !!8/25!!。"], ["(5)", "7", "【見る】−3² は「3²＝9 にマイナス」→−9。(−2)⁴ は −2を4回かける→＋16。【解く】−9＋16＝!!7!!。【ミス】かっこがあるかないかで答えがかわる。"], ["(6)", "√2", "【見る】√の中を、かけ算に分けて小さくする。【解く】√18＝√(9×2)＝3√2、√8＝√(4×2)＝2√2。 ▶ 3√2−2√2＝(3−2)√2＝!!√2!!。"], ["(7)", "−3x²y", "【見る】数・x・yを別々に計算する。【解く】数：−18÷6＝−3 ▶ x：x³÷x＝x² ▶ y：y²÷y＝y ▶ まとめて !!−3x²y!!。"], ["(8)", "x²−x−20", "【見る】かっこをひとつずつかけて展開する。【解く】(x＋4)(x−5)＝x×x＋x×(−5)＋4×x＋4×(−5)＝x²−5x＋4x−20。 ▶ −5x＋4x＝−x なので !!x²−x−20!!。"]]}, {"t": "問2 小問集合", "items": [["(1)", "−1，0，1", "【見る】絶対値は「0からの距離」。絶対値が2より小さい整数＝0からの距離が2未満の整数。【解く】数直線で0を中心に左右に2未満 → !!−1，0，1!!。（−2と2は「2より小さい」ではないので入らない）"], ["(2)", "半分（0.5倍）", "【見る】x円の0.5x円は「x円の半分」。【解く】例：「x円の半分」。「2分の1」でも正解です。"], ["(3)", "x＝4（まちがえ始めは2行目）", "【見る】方程式 3x−5＝x＋3 を順に見ます。【解く】移項（左右をうつすこと）では、うつした数の符号が逆になる。 ▶ xを左へ移す → ＋x が −x になる。左辺は 3x−x。 ▶ −5を右へ移す → +5 になる。右辺は 3＋5。 ▶ だから正しくは 3x−x＝3＋5。2行目の「3x＋x」がまちがい。 ▶ 2x＝8 → x＝4。"], ["(4)", "例：1＋(−3)", "【見る】「自然数＋整数」の答えが自然数にならない例を1つ作る。【解く】自然数はプラスの整数（1，2，3…）。整数にはマイナスがある。 ▶ 1＋(−3)＝−2。−2は自然数ではない。これが例。 ▶ 他に 2＋(−5)＝−3 などでもOK。"]]}, {"t": "問3 速さ・文章題", "items": [["(1)", "20分", "【見る】時間＝道のり÷速さ。【解く】1500m÷75m/分＝!!20分!!。"], ["(2)", "30分", "【見る】行きは20分。帰りは速さ150m/分なので 1500÷150＝10分。【解く】往復で 20＋10＝!!30分!!。"], ["(3)", "1200m", "【見る】グラフ（動き）を式にします。【解く】太郎さんは20分で公園に着き、そこから戻る。花子さんは18分後に出発。 ▶ 出発してからt分後の位置（学校からの距離） ▶ 太郎さん（折り返したあと）：1500−150(t−20) ▶ 花子さん：300(t−18) ▶ 出会うとき、位置が等しい → 1500−150(t−20)＝300(t−18) ▶ 1500−150t＋3000＝300t−5400 → 9900＝450t → t＝22。 ▶ 花子さんは 22−18＝4分間走った。300×4＝!!1200m!!。"]]}, {"t": "問4 文字式", "items": [["(1)", "10a＋b", "【見る】2けたの数は「十の位×10＋一の位」。【解く】十の位がa、一の位がbなら 10×a＋b＝10a＋b。 ▶ （例：37なら 10×3＋7）"], ["(2)", "2a−2", "【見る】「Pの十の位aを2倍して2をひく」をそのまま式にする。【解く】2×a−2＝!!2a−2!!。"], ["(3)", "10", "【見る】Rを式で表します。R＝5Q＋b、Q＝2a−2 なので【解く】R＝5(2a−2)＋b＝10a−10＋b。 ▶ P＝10a＋b と見くらべると、P＝R＋10。 ▶ だから k＝!!10!!。"], ["(4)", "89", "【見る】(3)でP＝R＋10とわかった。【解く】R＝79 なら P＝79＋10＝!!89!!。"]]}, {"t": "問5 確率", "items": [["(1)", "5通り", "【見る】大小2つのさいころ。目の出方は全部で6×6＝36通り。【解く】和が6になる組(a，b)を書き出す：(1,5)(2,4)(3,3)(4,2)(5,1)。 ▶ 大と小は区別するので、(1,5)と(5,1)は別のもの。全部で!!5通り!!。"], ["(2)", "3/4", "【見る】「積が偶数」は数えにくいので、反対の「積が奇数」を数える。【解く】積が奇数 → aもbも奇数（1，3，5）。3×3＝9通り。 ▶ 偶数の積は 36−9＝27通り。 ▶ 確率＝27/36＝!!3/4!!。"], ["(3)", "絶対値は1，確率5/18", "【見る】|a−b| の値ごとに、何通りあるか数える。【解く】0…6通り ・1…10通り ・2…8通り ・3…6通り ・4…4通り ・5…2通り（合計36） ▶ いちばん多いのは 1（10通り）。確率＝10/36＝5/18。"]]}, {"t": "問6 データの活用", "items": [["(1)", "ア4，イ3，ウ0.35，エ0.10", "【見る】相対度数＝度数÷全体の人数（20人）。【解く】ア：相対度数0.20 → 0.20×20＝4（人）。 ▶ イ：全体20人から、わかっている度数をひく。20−(3＋7＋4＋2＋1)＝3。 ▶ ウ：7÷20＝0.35。 ▶ エ：2÷20＝0.10。"], ["(2)", "26.0cm", "【見る】最頻値は「いちばん度数が多い階級の真ん中の値（階級値）」。【解く】度数が最大の階級は 25.5〜26.5（7人）。真ん中は (25.5＋26.5)÷2＝!!26.0cm!!。"], ["(3)", "例：26.5cmの人は26.5〜27.5の階級にいて、自分より大きい人は多くても同じ階級の3人と27.5以上の6人の計9人で、半数の10人より少ないから。", "【見る】「26.5cmの人が、大きい方から数えて半分（10人）以内に入るか」を、度数分布表で調べます。【解く】26.5〜27.5の階級にいる人たち（3人）は、最悪、全員が自分より大きいとして3人。 ▶ 27.5以上の階級の人たちは合計6人。 ▶ 自分より大きい人は、多くても 3＋6＝9人（人数は表から読む）。 ▶ 9人は半数の10人より少ないので、「自分は大きい方から半分以内」といえる。 ▶ 書き方：「～から。」の形で、数字を使った根拠を書く。【確認】記述なので、根拠が書けていればOK。原本の採点基準もご確認ください。"]]}, {"t": "問7 関数", "items": [["(1)", "9/4", "【見る】y＝x² に x＝3/2 を入れる。【解く】(3/2)²＝!!9/4!!。"], ["(2)", "y＝−1/2x＋3", "【見る】2点 A(−2，4)、B(3/2，9/4) を通る直線を求める。【解く】ステップ1（傾き）：yの増加÷xの増加＝(9/4−4)÷(3/2−(−2))＝(−7/4)÷(7/2)＝−1/2。 ▶ ステップ2（切片）：y＝−1/2x＋b に A(−2，4) を入れる。4＝−1/2×(−2)＋b＝1＋b → b＝3。 ▶ だから !!y＝−1/2x＋3!!。"], ["(3)", "21/4", "【見る】直線とy軸の交点 C(0，3) をとり、△AOBを2つの三角形に分ける。【解く】△AOC：底辺OC＝3、高さ＝Aのxの大きさ2 → 3×2÷2＝3。 ▶ △BOC：底辺OC＝3、高さ＝Bのx＝3/2 → 3×(3/2)÷2＝9/4。 ▶ あわせて 3＋9/4＝!!21/4!!。"]]}, {"t": "問8 円と三平方の定理", "items": [["(1)", "8", "【見る】AB＝AC＋CB＝12＋4＝16。ABは半円の直径。【解く】半径＝直径÷2＝16÷2＝!!8!!。"], ["(2)", "3", "【見る】円Pの半径をr とおいて、直角三角形で三平方の定理。【解く】OC＝AC−AO＝12−8＝4。POの長さは、円Pが半円Oの内側にふれているので PO＝8−r。 ▶ 直角三角形POCで OC²＋PC²＝PO² → 4²＋r²＝(8−r)²。 ▶ 16＋r²＝64−16r＋r² → 16r＝48 → r＝!!3!!。"], ["(3)", "864/25", "【見る】座標を使って考える。Oを(0，0)、C(4，0)、P(4，3)とする。【解く】O，P，Dは一直線で OD＝8、OP＝√(16＋9)＝5。 ▶ DはOPを 8/5 倍にのばした点なので D＝(4×8/5，3×8/5)＝(32/5，24/5)。 ▶ AE＝OA＋OE＝8＋32/5＝72/5、DE（高さ）＝24/5。 ▶ △AED＝72/5×24/5÷2＝!!864/25!!。"]]}], "R4_japanese": [{"t": "一 漢字の読み書き", "items": [["①", "けんきゅう", "【見る】「研究」の読み。「研」は「ケン」、「究」は「キュウ」。【解く】意味：物事を深く調べて、明らかにすること。【覚える】研究＝けんきゅう。音読み（中国から来た読み）が2つ並ぶ熟語。"], ["②", "せだい", "【見る】「世代」の読み。「世」は「セ」、「代」は「ダイ」。【解く】意味：同じ時代に生まれた人たちのまとまり。（例：若い世代）"], ["③", "みずうみ", "【解く】「湖」は訓読みで「!!みずうみ!!」。音読みは「コ」（例：湖水）。【ミス】「うみ」と読まない。「みずうみ」と3文字ともひらがなで書く。"], ["④", "ね", "【見る】「練る」＝何度も考えて、よりよくする。（例：作戦を練る）【解く】送りがな「る」を外した読み方が「!!ね!!」。音読みは「レン」（練習）。"], ["⑤", "ちょうせい", "【見る】「調整」の読み。「調」は「チョウ」、「整」は「セイ」。【解く】意味：ちょうどよい状態にととのえること。"], ["⑥", "病", "【見る】「ヤマイ」を漢字で書く。「病」。【解く】（例：恋の!!病!!）【覚える】「病」は「やまいだれ」の中に「丙」。"], ["⑦", "転", "【見る】「ころがる」を漢字で書く。「転」。【解く】「車へん」に「云」。車がころがるイメージ。"], ["⑧", "暑", "【見る】「あつい」には同じ読みの漢字が3つある。気温が高いのは「暑い」、ものが熱いのは「熱い」、厚みがあるのは「厚い」。【解く】ここでは夏の「あつい」なので「!!暑!!」。"], ["⑨", "拾", "【見る】「ひろう」を漢字で書く。「拾」。【解く】「てへん」＋「合」。手でひろうイメージ。"], ["⑩", "売店", "【見る】「バイテン」を漢字にする。「売」＝うる、「店」＝みせ。【解く】「!!売店!!」＝ものを売る小さな店。"]]}, {"t": "二 小説（藤原てい『旅路』）", "items": [["問一", "Ⅰ耳，Ⅱ腰，Ⅲ腹", "【見る】空所に入るのは体の部分。前後の言葉とつなげて、慣用句（決まった言い方）を作る。【解く】Ⅰ「聞く耳を持つ」＝人の話をきちんと聞こうとする ▶ Ⅱ「ベンチに^^腰^^を降ろす」＝すわる ▶ Ⅲ「腹がたつ」＝おこる ▶ 答えは !!耳・腰・腹!!【ミス】Ⅱを「肩」にしない。「肩を降ろす」という言い方はなく、ベンチに「すわる」ことなので「腰」。"], ["問二", "ウ", "【見る】品詞を調べる問題。「きびしく」の文法上の分類を考える。【解く】「きびしい」は「きびしかった」「きびしければ」と形が変わる（活用する）ので形容詞。「きびしく」はその連用形。【覚える】副詞は活用しない。【確認】原本の解答が手元にないので、文法から判断した答えです。原本もご確認ください。【ちがう】ア：名詞は「もの・こと」の名前で、形が変わらない ▶ イ：動詞は言い切りの形が「う段」（行く・食べる）で終わる ▶ エ：形容動詞は言い切りが「～だ」（静かだ） ▶ オ：副詞は形が変わらない（とても・ゆっくり）"], ["問三", "上諏訪の駅で、子供達が自分で注意して降りること。", "【見る】「母が期待したこと」を、本文の言葉をつなげて書く。【解く】部Aの前に、母は「責任を持って列車に乗るという態度を覚えさせなくては」と考えている。 ▶ 部Aの後ろに「上諏訪の駅はわかる筈…自分で…降りる」とある。 ▶ この2つをまとめて、「上諏訪の駅で、子供達が自分で注意して降りること」。"], ["問四", "子供達がワイワイさわぎ立てて、駅に着いたと気づかなかったから。", "【見る】理由を問う問題。「なぜ降りなかったのか」を本文から探す。【解く】本文には、子供達が「ワイワイさわぎ立てていて」、母の言葉を聞く耳を持っていなかった様子が書かれている。 ▶ だから「さわぎ立てて、駅に着いたと気づかなかったから」とまとめる。【確認】本文の最後で母は「お前達、お母さんの言葉をちゃんと聞いていないからですよ」と言っています。「さわいでいて、母の言葉（上諏訪で降りること）をちゃんと聞いていなかったから」とまとめても正解になると考えられます。"], ["問五", "後悔", "【見る】Ⅹ「をおぼえた」の前後の気持ちを読む。【解く】直後に「しかし、それはすべきではない、と思いかえした」とある。「あのとき教えてやるべきだった」という気持ち。 ▶ これを表す二字熟語は「!!後悔!!」。"], ["問六", "新宿で乗る時", "【見る】「あの時」は、前に出てきたある場面を指す。【解く】直前に「新宿で乗る時に、上諏訪で下車することは言ってある」とあるので、「!!新宿で乗る時!!」。"], ["問七", "子供達が降りず、私一人がホームに残されてしまうこと。", "【見る】「このようなこと」は、直前の場面を指す。【解く】だれも降りてこなかった ▶ 列車が行ってしまった ▶ 私一人がホームに残された ▶ これを「子供達が降りず、私一人がホームに残されてしまうこと」とまとめる。主語をはっきり書く。"], ["問八", "母として厳しく接しながらも、泣く姿に抱き上げたいほどいとおしさを感じる気持ちで表現されている。", "【見る】「母の気持ち」が2つ入るようにまとめる。【解く】きびしい気持ち：厳しい口調で言い聞かせている。 ▶ いとおしい気持ち：泣く姿を見て「抱き上げてやりたいほどいとおしかった」。 ▶ 書き方：「～しながらも、～」の形で、2つの気持ちを両方書く。40〜50字。【確認】記述なので、「厳しさ」と「いとおしさ」が入っていればOK。原本の採点基準もご確認ください。"]]}, {"t": "三 論説文（会話・図表の読み取り）", "items": [["問一ア", "社会の一員", "【見る】図Aの項目名から、あてはまる言葉を抜き出す。【解く】項目「自分は責任ある社会の一員だと思う」→「!!社会の一員!!」。（字数は解答欄に合わせる）"], ["問一イ", "変えられる", "【解く】図Aの項目「自分で国や社会を変えられると思う」から抜き出す。「!!変えられる!!」。"], ["問一ウ", "社会課題", "【解く】図Aの項目「自分の国に解決したい社会課題がある」から抜き出す。「!!社会課題!!」。"], ["問二Ⅰ", "他人", "【見る】「自律できない人」の特徴を本文から探す。【解く】本文に「うまくいかないことが起きると、他人のせいにしがち」とある。空所には「!!他人!!」が入る。"], ["問三", "ご存じですか", "【見る】「知っていますか」を、相手を高める敬語（尊敬語）に直す。【解く】「知る」の尊敬語は「ご存じです」。 ▶ 「!!ご存じですか!!」。"], ["問四", "日本の発電は、火力発電が約七割を占めているから。", "【見る】図Bの「日本」の棒グラフを見る。火力発電は「石炭」「石油」「天然ガス」を燃やす発電（本文の英子の言葉）。【解く】石炭31.9％＋石油その他6.8％＋天然ガス37.1％＝75.8％ ▶ 日本の発電の!!七割以上が火力発電!!なので、簡単には変えられない【確認】75.8％なので「約七割」より「七割以上」「四分の三」とするほうが正確です。原本の採点基準もご確認ください。"], ["問五Ⅱ", "原子力", "【見る】図Bでフランスを探す。原子力が71.6％でもっとも多い。【解く】空所には「!!原子力!!」。"], ["問五Ⅲ", "カナダ", "【解く】水力発電の割合が高い国を図Bで探す。水力59.0％の国は「!!カナダ!!」。"], ["問六Ⅳ①", "当事者意識", "【見る】会話の中の俊太郎の「他人事にしているだけではいけません」と反対の意味の言葉を、本文から探す。【解く】本文では、自分のこととして考える気持ちを「!!当事者意識!!」と言っている。"], ["問六Ⅳ②", "他人事", "【見る】「当事者意識」と反対の意味の言葉（漢字三字）。【解く】自分に関係ないと思うことを「!!他人事!!（ひとごと）」という。"]]}, {"t": "四 古文（古事記）", "items": [["問一a", "のりたまいしく", "【見る】歴史的仮名遣い（昔の書き方）を、現代仮名遣い（今の書き方）に直す。【解く】「詔りたまひしく」の「ひ」は、語の頭ではないので「い」に直す。 ▶ → !!のりたまいしく!!。【覚える】語頭以外の「ひ・ゐ・ゑ・を」は「い・い・え・お」に。"], ["問一b", "いうなり", "【見る】「言ふなり」の読み。語頭以外の「ふ」は「う」に直す。【解く】→ !!いうなり!!。"], ["問二", "煙は炊事のかまどの煙で、それが立たず民が貧しいと考えたから。", "【見る】天皇が「国に煙立たず。国皆貧窮し」と考えた理由を探す。【解く】煙＝かまどの煙（ご飯を作る煙） ▶ 煙が立たない → 人々がご飯も作れないほど貧しい ▶ これを「煙は炊事のかまどの煙で、それが立たず民が貧しいと考えたから」とまとめる。"], ["問三", "修繕の労役で貧しい民をさらに苦しめたくなかったから。", "【見る】なぜ宮殿を修理しなかったのか。【解く】修理をすれば、人々に労役（働くこと）を課すことになる。すでに貧しくて苦しい民をさらに苦しめてしまう。 ▶ だから修繕しなかった。"], ["問四", "人民", "【見る】「百姓」は、昔は「農民」ではなく広く「人々」のこと。【解く】ここでは「!!人民!!」と同じ意味。"], ["問五Ⅰ", "貧しい", "【解く】空欄Ⅰ：天皇は、民の暮らしが貧しいと察した。「!!貧しい!!」が入る。"], ["問五Ⅱ", "納税", "【解く】空欄Ⅱ：「課」は語注で「納税」と説明されている。天皇は!!納税!!を免除した。"], ["問五Ⅲ", "労役", "【解く】空欄Ⅲ：「役」は語注で「労役」と説明されている。天皇は!!労役!!を免除した。"], ["問五Ⅳ", "豊かに", "【見る】本文の最後に近い「^^人民富めり^^」（人民が豊かになった）に注目する。【解く】「富む」＝お金や物がたくさんある ▶ 古文の言葉をそのまま使わずに言いかえて !!豊かに!!【確認】「富めり」をそのまま使わない指示なので、「裕福に」なども正解になると考えられます。"]]}], "R3_english": [{"t": "問1 リスニング（絵の説明）", "items": [["No.1〜No.4", "—", "【確認】音声・スクリプトが手元にないため、解説と模範解答は作成していません。"]]}, {"t": "問2 リスニング（対話と質問）", "items": [["No.1〜No.4", "—", "【確認】音声・スクリプトが手元にないため、解説と模範解答は作成していません。"]]}, {"t": "問3 絵を表す単語（並べかえ）", "items": [["(1)", "house", "【見る】絵は「家」。英語で house。【解く】文字 s・u・h・o・e を並べて h-o-u-s-e。【覚える】house＝家"], ["(2)", "present", "【見る】絵は「プレゼント」。英語で present。【解く】文字 e・p・t・r・e・s・n を並べて p-r-e-s-e-n-t。【覚える】present＝プレゼント、おくりもの"]]}, {"t": "問4 be動詞の選択", "items": [["(1)", "are", "【見る】主語に合わせて be動詞を選ぶ。主語が you のときは are。【解く】You !!are!! an English teacher.（あなたは英語の先生です）【覚える】I→am、you・複数→are、he／she／it→is。"], ["(2)", "were", "【見る】主語は Jack and I（2人＝複数）。last week（先週）があるので過去の文。【解く】複数の過去のbe動詞は !!were!!。（was は I・he・she・it のとき）"]]}, {"t": "問5 疑問詞の選択", "items": [["(1)", "ウ When", "【見る】答えの内容から疑問詞を選ぶ。「いつ」駅に着いたか。【解く】When did he arrive at the station?（彼はいつ駅に着きましたか）【覚える】When＝いつ、Where＝どこ、How＝どうやって、What＝何【ちがう】ア：How＝どうやって ▶ イ：What＝何 ▶ エ：Where＝どこ"], ["(2)", "ア How", "【見る】「どうやって」（交通手段）学校へ行くか。【解く】How does Bob go to school every day?（ボブは毎日どうやって学校に行きますか）【ちがう】イ：What＝何 ▶ ウ：When＝いつ ▶ エ：Where＝どこ"], ["(3)", "エ Where", "【見る】「どこに」いたか。場所をたずねるのは Where。【解く】Where were you yesterday?（あなたは昨日どこにいましたか）【ちがう】ア：How＝どうやって ▶ イ：What＝何 ▶ ウ：When＝いつ"]]}, {"t": "問6 単語の関係", "items": [["(1)", "third", "【見る】左の組の関係を見つける。one（1）の「～番目」は first。【解く】同じ関係で three（3）の「～番目」は !!third!!。"], ["(2)", "went", "【見る】左の組の関係：buy（買う）の過去形は bought。【解く】同じ関係で go（行く）の過去形は !!went!!。【ミス】go－went－gone の不規則動詞。"]]}, {"t": "問7 書きかえ", "items": [["(1)①", "He plays the piano every day.", "【見る】主語を He に変える。3人称単数・現在なので、動詞に s をつける。【解く】play → plays。 ▶ He plays the piano every day."], ["(1)②", "I am playing the piano now.", "【見る】now（今）なので「今～している」＝ 現在進行形（am／are／is ＋ ～ing）。【解く】主語 I なので am playing。"], ["(2)①", "Did you study English yesterday?", "【見る】過去の一般動詞の疑問文。Did を文の先頭に出し、動詞は原形に戻す。【解く】You studied → Did you study ～?"], ["(2)②", "I did not study English yesterday.", "【見る】過去の否定文は did not（didn't）＋ 動詞の原形。【解く】studied → study。"]]}, {"t": "問8 語形の選択", "items": [["(1)", "play", "【見る】Don't ＋ 動詞の原形 ＝「～してはいけません」。【解く】Don't !!play!! baseball in this park.（この公園で野球をしてはいけません）"], ["(2)", "listening", "【見る】enjoy のあとの動詞は ～ing の形になる。【解く】enjoy !!listening!! to ～（～を聞いて楽しむ）。【覚える】enjoy・finish・stop のあとは ～ing。"], ["(3)", "spoken", "【見る】「世界中で話されている言語」。the language の後ろから説明する言葉は、「～される」の意味の過去分詞。【解く】speak－spoke－spoken。the language !!spoken!! all over the world。"]]}, {"t": "問9 会話文", "items": [["(1)", "ウ Just a moment", "【見る】会話の流れを読む。「行きましょう、11時です」→「（　）、歯をみがかないと」。【解く】「ちょっと待って」の意味の Just a moment が合う。【ちがう】ア：Thank you（ありがとう）は、さそわれて「歯をみがかないと」と言う前の言葉に合わない ▶ イ：I'll show you（見せてあげる）は話に合わない"], ["(2)", "ア I'll call you later", "【見る】「質問してもいいですか」に対して、「ごめんなさい、もう行かなくては」のあとに続く言葉。【解く】「あとで電話します」＝ I'll call you later。【ちがう】イ：You'll get well soon（すぐによくなるよ）は病気の人へのはげましの言葉 ▶ ウ：My watch is broken（私の時計はこわれている）は、急いでいる理由にならない"]]}, {"t": "問10 語形変化", "items": [["(1)", "loved", "【見る】受け身（～される）の文は be動詞 ＋ 過去分詞。【解く】is loved ＝ 愛されている。love－loved－!!loved!!。"], ["(2)", "taller", "【見る】than（～より）があるので、比較級にする。【解く】tall → taller。Ken is !!taller!! than Mike.（ケンはマイクより背が高い）"]]}, {"t": "問11 並べかえ", "items": [["(1)", "is important to study English", "【見る】It is important to ～ ＝「～することは重要です」。【解く】It は形式主語（仮の主語）で、to 以下が本当の主語。 ▶ It is important to study English."], ["(2)", "long have you played tennis", "【見る】「どのくらいの間～していますか」＝ How long have you ～?（現在完了・継続）。【解く】How long have you played tennis?"], ["(3)", "don't have to come here", "【見る】「～する必要はない」＝ don't have to ＋ 動詞の原形。【解く】You don't have to come here."], ["(4)", "is the bag that I made", "【見る】「これは私が作ったバッグです」。the bag を後ろから that I made（私が作った）で説明する。【解く】This is the bag that I made yesterday."]]}, {"t": "問12 会話文（ホームステイ）", "items": [["(1)", "イ", "【見る】「ちょっと待って」のあとで Here you are（はい、どうぞ）と何かを渡している。【解く】直後に「開けていい？」とあるので、プレゼントを渡す場面。I have a present for you. の !!イ!!。【ちがう】ア：No, thank you.（いいえ、けっこうです）は断る言葉 ▶ ウ：Can you walk around?（歩き回れますか）は話に合わない ▶ エ：夏にいい、は服を見たあとの言葉で(2)で使う ▶ オ：I don't think so.（そう思わない）は意見への返事 ▶ カ：写真の提案は(3)で使う ▶ キ：I'd love to.（ぜひそうしたい）はさそわれたときの返事"], ["(2)", "エ", "【見る】「これはハワイのドレス（ムームー）です」への返事。【解く】「それはいいね。夏にいいですね（It's good for summer season.）」の !!エ!!。【ちがう】ア：No, thank you. はプレゼントを断ることになる ▶ イ：プレゼントを渡す言葉は(1)で使う ▶ ウ：Can you walk around? は話に合わない ▶ オ：I don't think so. では「すてきね」と言ったことと反対になる ▶ カ：写真の提案は(3)で使う ▶ キ：I'd love to. はさそわれたときの返事"], ["(3)", "カ", "【見る】着た姿を見て「とても似合っています」と言ったあと、写真の提案。【解く】Shall I ～?（～しましょうか）に Yes, please.（お願いします）と答えている。!!カ!!。【ちがう】ア：No, thank you. ではあとの Yes, please. につながらない ▶ イ：プレゼントは(1)で渡している ▶ ウ：Can you walk around? にYes, please.（お願いします）は合わない ▶ エ：夏にいい、は(2)で使う ▶ オ：I don't think so. は「とても似合う」と言ったあとに合わない ▶ キ：I'd love to. は自分が答える言葉で、Yes, please. の前には来ない"]]}, {"t": "問13 長文（水と人体／海の生き物）", "items": [["(1)", "Because we can't live for more than about three days without water.", "【見る】Why（なぜ）の答えは、本文で理由を探す。【解く】Water is very important for the human body. のすぐ後ろの文に理由。「水なしでは3日ほどしか生きられない」。 ▶ Because ＋ 主語 ＋ 動詞 の形で書く。"], ["(2)", "食べ物と酸素を体の各部分へ運ぶこと。", "【見る】本文：血液は食べ物を体のいろいろな部分に運ぶ。また、肺から体の他の部分に酸素も運ぶ。【解く】これを日本語でまとめる。"], ["(3)", "Water is very important.", "【見る】条件は「主語と動詞のある3語以上の英文」。【解く】文章全体のテーマ「水の大切さ」を1文にする。 ▶ 例：Water is very important. ／ We need water."], ["(4)", "the blue whale", "【見る】It が何を指すかは、直前の文を見る。【解く】The biggest ocean animal is the blue whale. の !!the blue whale!! を受けている。"], ["(5)", "most of the oceans", "【見る】本文の最後の文を探す。Blue whales live in most of the oceans.【解く】（　）に入る4語は most of the oceans。"], ["(6)", "animals", "【見る】2つの空所に共通して入る語を探す。【解く】Some (animals) live in salt water.／Many other (animals) live in salt water. ▶ 共通する語は !!animals!!。"], ["(7)", "例：I use water to wash my hands and cook dinner every day.", "【見る】条件は「主語と動詞のある5語以上、本文をそのまま写さない」。【解く】水を何に使うか1つ考える（手を洗う・お風呂など）。 ▶ I use water to ～. の形で書く。 ▶ 例：I drink water every day. ／ I use water to take a bath."]]}], "R3_math": [{"t": "問1 計算", "items": [["(1)", "−5", "【見る】3＋(−8)は、3−8と同じ。【解く】8のほうが大きいので答えはマイナス。8−3＝5 → !!−5!!。"], ["(2)", "−63", "【解く】数だけかけ算：7×9＝63。 ▶ 符号：マイナスが1つ → マイナス。!!−63!!。"], ["(3)", "−1/6", "【見る】分母をそろえる（通分）。分母2と3の最小公倍数は6。【解く】1/3＝2/6、1/2＝3/6。 ▶ 2/6−3/6＝!!−1/6!!。"], ["(4)", "36", "【見る】わり算は「逆数をかけるかけ算」にする。−1/6の逆数は −6。【解く】−6÷(−1/6)＝−6×(−6)＝36。 ▶ 符号：マイナス×マイナス＝プラス。"], ["(5)", "−1", "【見る】−3² は「3²＝9 にマイナス」なので−9。【解く】−9＋8＝!!−1!!。【ミス】(−3)² なら＋9。かっこがあるかどうかが大事。"], ["(6)", "√6", "【見る】√24 を小さくする。24＝4×6 なので √24＝2√6。【解く】2√6−√6＝(2−1)√6＝!!√6!!。"]]}, {"t": "問2 小問集合", "items": [["(1)", "300円の支出（300円使うこと）", "【見る】＋が「収入（もらう）」なら、反対の意味のーは「支出（使う）」。【解く】−300円は「300円の支出」。"], ["(2)", "1/2", "【見る】確率＝あてはまる場合の数÷全部の場合の数。【解く】3以下の目は 1，2，3 の3通り。全部で6通り。 ▶ 3/6＝!!1/2!!。"], ["(3)", "1000−4a（円）", "【見る】ケーキ4個の代金は a×4＝4a円。【解く】おつり＝出したお金−代金＝!!1000−4a（円）!!。"], ["(4)", "x²−5x＋6", "【見る】かっこを1つずつかける。【解く】(x−2)(x−3)＝x×x＋x×(−3)＋(−2)×x＋(−2)×(−3)＝x²−3x−2x＋6。 ▶ !!x²−5x＋6!!。"]]}, {"t": "問3 小問集合", "items": [["(1)", "素数ではない", "【見る】素数は「1と自分自身しか約数がない数」。【解く】37²＝37×37。37 でわり切れるので、1と自分自身以外の約数（37）がある。 ▶ だから!!素数ではない!!。"], ["(2)", "長方形", "【見る】円柱をたてにまっすぐ（底面に垂直に）切ると、切り口は長方形。【解く】横の長さが円の直径、たての長さが高さ。"], ["(3)", "図の正方形の左端の頂点に○", "【見る】四角錐を組み立てたとき、点Aと重なる点を探す。【解く】側面の三角形のとがった頂点が1つにあつまるところが「Aと重なる」。展開図では、底面の正方形の頂点（図で一番左）が点Aと重なる。"], ["(4)", "直方体の体積", "【解く】たて×横×高さ＝!!直方体の体積!!。"], ["(5)", "1，2，3", "【見る】√a＜2 は √a＜√4 と同じ。だから a＜4。【解く】自然数（1，2，3…）で4より小さいのは !!1，2，3!!。"]]}, {"t": "問4 文章題（クッキー）", "items": [["(1)", "3x＋16", "【解く】3枚ずつx人に配ると 3×x＝3x（枚）。16枚あまったので、全部で !!3x＋16!!（枚）。"], ["(2)", "3x＋16＝4x＋7", "【見る】4枚ずつ配ると 4x枚いる。7枚あまるので、全部の枚数は 4x＋7（枚）。【解く】(1)と同じ枚数なので !!3x＋16＝4x＋7!!。"], ["(3)", "9人", "【見る】x の項を左、数を右に集める（移項）。【解く】3x−4x＝7−16 → −x＝−9 → x＝9。"], ["(4)", "2枚足りない", "【見る】クッキーの全部の枚数は 3×9＋16＝43（枚）。【解く】5枚ずつ9人に配ると 5×9＝45（枚）いる。 ▶ 45−43＝2 → !!2枚足りない!!。"]]}, {"t": "問5 文字式の説明", "items": [["①", "2m", "【解く】偶数は「2の倍数」＝2×整数。整数をmとすると !!2m!!。"], ["②", "2n＋1", "【解く】奇数は「偶数＋1」＝2×整数＋1。整数をnとすると !!2n＋1!!。"], ["③", "2(m＋n)＋1", "【見る】偶数＋奇数＝2m＋(2n＋1)＝2m＋2n＋1。【解く】2でくくると !!2(m＋n)＋1!!。"], ["④", "整数", "【解く】m，nは整数なので、m＋nも!!整数!!。"], ["⑤", "奇数", "【見る】2×整数＋1 の形になっているので奇数。【解く】だから「偶数と奇数の和は!!奇数!!」といえる。"]]}, {"t": "問6 折り返し（直角三角形）", "items": [["(1)AQ", "4cm", "【見る】点BをAに重ねて折ると、折り目PQは「ABを真ん中で直角に分ける線」。【解く】QはABの真ん中（中点）なので AQ＝8÷2＝!!4cm!!。"], ["(1)面積", "18cm²", "【見る】「全体−切り取った部分」で求める。【解く】PQとACは、どちらもABに垂直なので平行。△BQP∽△BAC（相似）。相似比はBQ：BA＝4：8＝1：2。 ▶ PQ＝6÷2＝3cm、QB＝4cm。△BQP＝4×3÷2＝6cm²。 ▶ △ABC＝8×6÷2＝24cm²。 ▶ 四角形AQPC＝24−6＝!!18cm²!!。"], ["(2)CS", "5cm", "【見る】点BをCに重ねると、折り目RSはBCの真ん中を通る。【解く】SはBCの中点なので CS＝10÷2＝!!5cm!!。"], ["(2)面積", "117/8 cm²", "【見る】(1)と同じで「△ABC−折り返した三角形」。【解く】△BSR∽△BAC（角Bが共通、直角がある）。BS：BA＝5：8。 ▶ SR＝AC×5/8＝6×5/8＝15/4cm。 ▶ △BSR＝5×15/4÷2＝75/8cm²。 ▶ 四角形ARSC＝24−75/8＝192/8−75/8＝117/8cm²。"]]}, {"t": "問7 関数 y＝1/2x²と直線", "items": [["(1)", "(−2，2)", "【見る】y＝1/2x² に x＝−2 を入れる。【解く】y＝1/2×(−2)²＝1/2×4＝2。A!!(−2，2)!!。"], ["(2)", "y＝−x", "【見る】原点O(0，0)とA(−2，2 い"]]}, {"t": "四 古文「方丈記」", "items": [["問一a", "つたえきく", "【見る】歴史的仮名遣い → 現代仮名遣い。「伝へ聞く」の「へ」は「え」に。【解く】→ !!つたえきく!!。"], ["問一b", "あわれみ", "【解く】「憐れみ」は古文では「あはれみ」。語中の「は」は「わ」に直す。→ !!あわれみ!!。"], ["問一c", "おさめたまう", "【解く】「治め給ふ」。「給ふ」＝「たまう」（ふ→う）。→ !!おさめたまう!!。"], ["問一d", "みたまう", "【解く】「見給ふ」。「給ふ」は「たまう」。→ !!みたまう!!。"], ["問一e", "ふたとせ", "【解く】「二年」は古文では「!!ふたとせ!!」と読む。"], ["問二", "民を恵み、世を助け給ふによりてなり", "【見る】昔の賢い天子が、税を軽くしたのはなぜか。本文に「これ、民を恵み、世を助け給ふによりてなり」とある。【解く】その部分を抜き出す。"], ["問三", "イ", "【見る】古文の意味を現代語で理解する。【解く】「よからぬ事ども」＝悪いことども、「うち続きて」＝相次いで、「五穀ことごとくならず」＝五穀がまったく実らなかった。 ▶ これに合うものを選ぶ → !!イ!!。【ちがう】ア：「よいことが続いた」が逆（よからぬ＝よくない） ▶ ウ：「五穀がなくなることはなかった」が逆 ▶ エ：「五徳」は本文にない"], ["問四", "エ", "【見る】『方丈記』の作者は ^^鴨長明^^（鎌倉時代）。【解く】作品と作者を結びつけて覚える → !!エ!!【ちがう】ア：清少納言は『枕草子』 ▶ イ：紫式部は『源氏物語』 ▶ ウ：小林一茶は『おらが春』（俳句） ▶ オ：兼好は『徒然草』【覚える】三大随筆＝『枕草子』（清少納言）・『方丈記』（鴨長明）・『徒然草』（兼好）。"]]}]};const T={"R7": [{"t": "問10 制服か私服か（生徒4人の意見）", "lines": [["Mike", "We are very busy every morning, / so we don't have much time / to choose our clothes. / First, / if I choose school uniform, / I don't have to think / what to wear. / Second, / I think / it looks better, / and gives a better impression / than my clothes. / Also / it may be useful / to know / how to put on a tie and so on / when I start to work / after graduation.", "私たちは忙しい／毎朝／だから／私たちはあまり時間がない／服を選ぶための／第一に／もし私が制服を選ぶなら／私は考えなくてよい／何を着るか／第二に／私は思う／それはより良く見える／そして与える／より良い印象を／私の服よりも／また／それは役に立つかもしれない／知っておくことは／ネクタイの結び方を／など／私が働き始めるとき／卒業後に"], ["Jane", "I want to be a designer. / I've been interested in fashion / for two years, / and studied styles / which were nice for me / in magazines. / So I have many clothes. / When the school admits clothes / that each person wants to wear, / I can express who I am. / However, / we have to be careful / how we look like, / not only at school / but also out of school.", "私はデザイナーになりたい／私はファッションに興味を持ってきた／2年間／そして研究した／スタイルを／私に合う／雑誌で／だから私は多くの服を持っている／学校が認めるとき／服を／それぞれの人が着たい／私は表現できる／私が誰なのかを／しかし／私たちは気をつけなければならない／私たちがどう見えるかに／学校でだけでなく／学校の外でも"], ["Mary", "I agree with wearing their own clothes. / I'm so happy / if we can choose / school uniforms / or our own clothes / to school. / Even if we are allowed to wear our own clothes, / some students want to wear a school uniform. / It's important / that each student can decide / which to wear / depending on the weather, / season, / situation, / and so on.", "私は賛成だ／自分の服を着ることに／私はとてもうれしい／もし私たちが選べるなら／制服を／または自分の服を／学校に着る／たとえ自分の服を着ることが許されても／制服を着たい生徒もいる／大切だ／それぞれの生徒が決められることが／どちらを着るか／天気に応じて／季節／状況／など"], ["Jack", "I have an older brother / who graduated from high school. / I want to go to the same school / which he graduated. / The rule of his school is / that they must wear a school uniform. / It is so expensive. / If I wear the same school uniform, / my parents will be glad. / It leads to saving money.", "私には兄がいる／高校を卒業した／私は同じ学校に行きたい／彼が卒業した／彼の学校のルールは／彼らは制服を着なければならないというもの／それはとても高い／もし私が同じ制服を着れば／私の両親は喜ぶだろう／それはお金を節約することにつながる"]]}, {"t": "問11 図書館便り（健とスミス先生の会話）", "lines": [["Ms. Smith", "Hi, Ken. / What are you doing?", "こんにちは、健／あなたは何をしていますか"], ["Ken", "Hello, Ms. Smith. / I'm making the Library News / for next month.", "こんにちは、スミス先生／私は図書館便りを作っています／来月の"], ["Ms. Smith", "What is the topic / for September?", "話題は何ですか／9月の"], ["Ken", "I will ask some teachers and students / to write about a book / they like the best. / Ms. Smith, / do you like reading books?", "私は何人かの先生と生徒に頼むつもりです／本について書くように／彼らがいちばん好きな／スミス先生／あなたは読書が好きですか"], ["Ms. Smith", "{{(2)①:Of course.}} / I can't imagine my life / without books. / My friends call me a bookworm.", "もちろん／私は想像できません／私の生活を／本なしの／友だちは私を本の虫と呼びます"], ["Ken", "A bookwo…? / What does it mean?", "本の虫…？／それはどういう意味ですか"], ["Ms. Smith", "It's a little living thing / that eats books. / But it also means a person / who likes reading very much.", "それは小さな生き物です／本を食べる／でも、それは人のことも意味します／読書がとても好きな"], ["Ken", "I see. / Could you write something / about the book / which you recommend to us / for the next Library News?", "なるほど／何か書いていただけませんか／本について／あなたが私たちにすすめる／次の図書館便りのために"], ["Ms. Smith", "OK. / I have many books / I love to read. / It is difficult to choose one. / Oh, / I read \"TOTTO-CHAN, The Little Girl at the Window.\" / This book is translated into 35 languages / and is read all over the world. / I read it in English. / Did you read it in Japanese?", "いいですよ／私は多くの本を持っています／読むのが大好きな／1冊を選ぶのは難しい／そうだ／私は『窓ぎわのトットちゃん』を読みました／この本は35の言語に翻訳されています／そして世界中で読まれています／私は英語で読みました／あなたは日本語で読みましたか"], ["Ken", "No, / but I watched it as an animated movie / last year. / Was the English version difficult?", "いいえ／でも私はアニメ映画として見ました／昨年／英語版は難しかったですか"], ["Ms. Smith", "Yeah, / it was a little difficult. / {{(3)並べかえ:It is a wonderful book written by Tetsuko Kuroyanagi.}} / She wrote it in 1981. / She is a very popular Japanese TV personality, / an actor and an essayist. / She is interested in welfare and peace. / She also served as a UNICEF Goodwill Ambassador.", "ええ／少し難しかったです／それは素晴らしい本です／黒柳徹子によって書かれた／彼女はそれを1981年に書きました／彼女はとても人気のある日本のテレビタレントです／俳優でありエッセイストでもある／彼女は福祉と平和に興味があります／彼女はユニセフ親善大使も務めました"], ["Ken", "I know. / But she was expelled from elementary school / because she was restless.", "知っています／でも彼女は小学校から追い出されました／落ち着きがなかったので"], ["Ms. Smith", "That's right. / In her new school, Tomoe Gakuen, / she met children / with various problems, / disabilities / and sad experiences. / Totto-chan, / Tetsuko's nickname, / and other children learned from each other, / grew, / and developed their individualities / by always working together.", "その通りです／新しい学校、トモエ学園で／彼女は子どもたちに出会いました／さまざまな問題を持つ／障害／そして悲しい経験／トットちゃん／徹子のニックネーム／そして他の子どもたちは互いから学び／成長し／そして個性を伸ばしました／いつも一緒に活動することで"], ["Ken", "Sounds nice. / It's true that {{(4):everyone is different and everyone is good.}}", "いいですね／本当ですね／みんな違って、みんないい"], ["Ms. Smith", "Tomoe's principal, Mr. Kobayashi, / repeatedly told her / \"You are really a good girl, you know.\" / He said this, / even if she did something different and strange. / {{(5):Those words}} continued to shine / like jewels / in Totto-chan's mind.", "トモエの校長先生、小林先生は／何度も彼女に言いました／「君は本当はいい子なんだよ」／彼はこう言いました／たとえ彼女が変わったおかしなことをしても／その言葉は輝き続けました／宝石のように／トットちゃんの心の中で"], ["Ken", "I really want to read this book. / Please show me the English version.", "私はこの本をぜひ読みたいです／英語版を見せてください"], ["Ms. Smith", "Sure. / I want many students to know / that {{(6):reading is fun.}} / Books teach us many good things.", "もちろん／私は多くの生徒に知ってほしい／読書は楽しいということを／本は私たちに多くのよいことを教えてくれる"], ["Ken", "{{(2)⑤:I think so, too.}} / I enjoyed talking with you today.", "私もそう思います／私は今日あなたと話して楽しかったです"], ["Ms. Smith", "Me, too. / Good luck.", "私もです／がんばってね"]]}], "R4": [{"t": "問10 ダックスフンドの会話文", "lines": [["A", "Do you know a \"dachshund\"?", "あなたは知っていますか／ダックスフンドを"], ["B", "Yes, I do. / It's a kind of German dogs / {{(1)A:that has short legs.}}", "はい、知っています／それはドイツの犬の一種です／足が短い"], ["A", "That's right. / But it was also the name / of an American food.", "その通りです／でもそれは名前でもありました／アメリカの食べ物の"], ["B", "Oh, really? / I didn't know it. / Please tell me about it.", "へえ、本当に／私は知りませんでした／それについて教えてください"], ["A", "In 1871, / a German introduced this food / to the United States. / {{(2)B:}} / He called it a \"dachshund\", / and sold it at his shop.", "1871年に／あるドイツ人がこの食べ物を紹介しました／アメリカに／彼はそれをダックスフンドと呼びました／そして自分の店で売りました"], ["B", "How many \"dachshunds\" did he sell?", "何本のダックスフンドを彼は売りましたか"], ["A", "He sold thousands every year. / Many Americans liked to eat them / because they were good and easy to eat, / and became more and more popular / all over the United States.", "彼は毎年何千も売りました／多くのアメリカ人が食べるのを好みました／それらがおいしくて食べやすかったので／そしてますます人気になりました／アメリカ中で"], ["B", "{{(2)C:}} / Is it still popular now?", "今でもまだ人気がありますか"], ["A", "Yes, it is. / But, in 1901, / the name was changed.", "はい／でも1901年に／名前が変えられました"], ["B", "Why was it changed then?", "なぜそのとき変えられたのですか"], ["A", "At a ballpark, / food venders were selling \"dachshunds\" / and saying, / \"They're red hot!\" / Then, / a writer wrote the news about it, / but he didn't know the spelling of \"dachshund.\"", "野球場で／食べ物の売り子がダックスフンドを売っていました／そして言っていました／熱々だよ／すると／ある記者がそれについての記事を書きました／でも彼はダックスフンドの綴りを知りませんでした"], ["B", "Really? / What did he do?", "本当に／彼はどうしましたか"], ["A", "So, / he gave it a new name. / It is still used by everyone today. / {{(2)D:}} / Of course, you know.", "それで／彼はそれに新しい名前をつけました／それは今でもみんなに使われています／もちろん／あなたは知っています"], ["B", "I wonder what it is. / What is the name?", "私は何だろうと思います／その名前は何ですか"], ["A", "OK, I'll tell you. / It is \"{{(3)E:Hot dog}}.\"", "いいですよ／教えます／それは「ホットドッグ」です"]]}, {"t": "問11 健人の説明文", "lines": [["健人", "Hi, / I will tell you about this town / and around our houses. / First, / I want you to know the place of supermarket. / This is the big store in this town. / So you can get many goods / which you want.", "こんにちは／私はあなたに話します／この町について／そして私たちの家の周りについて／最初に／私はあなたに知ってほしい／スーパーの場所を／これはこの町で大きな店です／だからあなたはたくさんの品物を手に入れられます／あなたが欲しい"], ["健人", "Second, / you may usually go to station / because the station is near our houses. / If you use trains many times, / you should check the time / when trains leave.", "2つ目に／あなたはたぶんよく駅へ行くでしょう／駅は私たちの家の近くにあるので／もしあなたが何度も電車を使うなら／あなたは時間を確認するべきです／電車が出発する"], ["健人", "But there are some problems. / There is not a hospital in this town. / You have to go to the next town / to see a doctor. / It takes about 20 minutes / from this town by car. / And there is not a park. / Children don't have the place / to play soccer, baseball, basketball, and so on.", "でもいくつか問題があります／この町には病院がありません／あなたは隣の町へ行かなければなりません／医者に診てもらうために／約20分かかります／この町から車で／そして公園がありません／子どもたちには場所がありません／サッカー、野球、バスケットボールなどをする"], ["健人", "Do you have any questions?", "何か質問はありますか"]]}, {"t": "問12 トーマスの話", "lines": [["地の文", "Thomas was a high school student / who loved music. / He had friends / who didn't have experience / of playing instruments. / They liked to listen to his songs / because he was good at playing the instruments and singing. / He wanted to become a great musician. / He had the idea: / musicians had to be \"VERY\" good / at playing instruments. / He was always thinking / about the way to play instruments very well / and practiced them every day. / However, / a bad thing happened to him.", "トーマスは高校生でした／音楽が大好きな／彼には友達がいました／経験がない／楽器を演奏した／彼らは彼の歌を聞くのが好きでした／彼は楽器を演奏することと歌うことが上手だったので／彼は偉大なミュージシャンになりたかった／彼には考えがありました／ミュージシャンはとても上手でなければならない／楽器を演奏するのが／彼はいつも考えていました／楽器をとても上手に演奏する方法を／そして毎日それらを練習しました／しかし／悪いことが彼に起こりました"], ["地の文", "One day, / he was walking to school / and listening to music. / He didn't realize / that a car appeared from a corner. / So the car hit him, / and he fell down on the road / and injured his arms. / He was taken to the hospital, / and the doctor said, / \"you may not be able to play instruments anymore.\" / He thought / that his dream was broken. / His friends couldn't believe the news. / They visited him in the hospital. / He talked calmly / but he looked so sad / and it seemed / that he didn't want to think of music. / After his friends saw Thomas, / they wanted to cheer him up. / One of the friends said, / \"What can we do for Thomas?\" / After a while, / another friend said, / \"I have an idea / Thomas will be surprised at.\" / They thought / that it was very nice / and said, / \"Let's do it!\"", "ある日／彼は学校へ歩いていました／そして音楽を聞いていました／彼は気づきませんでした／車が角から現れたことに／それで車が彼にぶつかりました／そして彼は道路に倒れました／そして腕をけがしました／彼は病院へ運ばれました／そして医者は言いました／あなたはもう楽器を演奏できないかもしれません／彼は思いました／自分の夢がこわれたと／彼の友達はその知らせを信じられませんでした／彼らは病院で彼を訪ねました／彼は穏やかに話しました／でもとても悲しそうに見えました／そして思われました／彼は音楽のことを考えたくないように／友達はトーマスに会ったあと／彼らは彼を元気づけたいと思いました／友達の一人が言いました／トーマスのために私たちは何ができるだろう／しばらくして／別の友達が言いました／私には考えがある／トーマスが驚くような／彼らはそれはとてもいいと思いました／そして言いました／それをやろう"], ["地の文", "One month later, / Thomas came back to school. / His friends said to him, / \"We want to show you one thing after school. / Come to the gym!\" / Thomas went there after school. / There were his classmates and their teacher. / His friends were ready / to play instruments on the stage. / {{(2):He was surprised.}} / His friends said to him, / \"We are ready to play instruments / but we need a singer today. / {{(3):Could you sing a song we practiced?}}\" / He cried / because he felt their warming-friendship. / After he finished crying, / he sang a song / from the bottom of his heart. / Their performance was not so good, / but everyone thought / that it was the best song / they ever listened to. / Thomas felt / he had good friends / and that it's \"VERY\" important / not only to be good at playing instruments / but also to think about others too. / Thomas and his friends decided / to form a band.", "1か月後／トーマスは学校に戻りました／友達は彼に言いました／放課後に君に見せたいものがある／体育館に来て／トーマスは放課後にそこへ行きました／彼のクラスメートと先生がいました／友達は準備ができていました／ステージで楽器を演奏する／彼は驚きました／友達は彼に言いました／私たちは楽器を演奏する準備ができている／でも今日は歌う人が必要だ／私たちが練習した歌を歌ってくれませんか／彼は泣きました／彼らの暖かい友情を感じたので／泣き終わったあと／彼は歌を歌いました／心の底から／彼らの演奏はあまり上手ではありませんでした／でもみんな思いました／それは最高の歌だと／今まで聞いた／トーマスは感じました／よい友達がいると／そして「とても」大切だと／楽器を演奏するのが上手なだけでなく／他人を思いやることも／トーマスと友達は決めました／バンドを結成すると"], ["地の文", "Ten years later, / the band became famous around the world. / Thomas and his friends send a lot of people / their songs / which cheer them up.", "10年後／そのバンドは世界中で有名になりました／トーマスと友達は多くの人々に送っています／彼らの歌を／それが彼らを元気づける"]]}], "R3": [{"t": "問13 水と人体／海の生き物", "lines": [["本文（あ）", "The human body contains lots of water. / Our body is about 70% water. / Our brain is about 85% water / and our bones are about 33% water. / {{(1):Water is very important for the human body.}} / We can live for four weeks without food, / but {{(1):we can't live for more than about three days without water!}}", "人間の体は含む／たくさんの水を／私たちの体は約70%が水です／私たちの脳は約85%が水／そして私たちの骨は約33%が水です／水は人間の体にとてもだいじです／私たちは4週間生きられる／食べ物なしで／しかし／私たちは約3日より長くは生きられない／水なしでは"], ["本文（あ）", "We need to drink about eight glasses of water every day. / We need to drink even more water / when we play sports / and when it's hot. / We need water / because it keeps our blood healthy. / Our blood is about 50% water. / {{(2):Blood takes food to different parts of our body.}} / {{(2):It takes oxygen from our lungs to other parts of our body, too.}}", "私たちは飲む必要がある／約8杯の水を／毎日／私たちはさらにもっと多くの水を飲む必要がある／私たちがスポーツをするとき／そして暑いとき／私たちは水が必要です／それが私たちの血液を健康に保つから／私たちの血液は約50%が水です／血液は食べ物を運ぶ／私たちの体のいろいろな部分に／それは酸素を運ぶ／私たちの肺から／私たちの体の他の部分へ／もまた"], ["海の生き物", "Lots of animals live in the water. / Some {{(6):animals}} live in salt water. / They live in seas and oceans. / The biggest ocean animal is {{(4):the blue whale}}. / It can be more than 30 meters long / and 200 metric tons. / It eats very small ocean animals / called krill. / It can eat 4 metric tons of krill in a day! / {{(5):Blue whales live in most of the oceans.}}", "たくさんの動物が住んでいる／水の中に／いくつかの動物は住んでいる／塩水の中に／それらは住んでいる／海と大洋に／一番大きな海の動物は／シロナガスクジラです／それは30メートル以上の長さになることがある／そして200メートルトン／それはとても小さな海の動物を食べる／オキアミと呼ばれる／それは1日に4メートルトンのオキアミを食べることができる／シロナガスクジラは住んでいる／大洋のほとんどに"], ["海の生き物", "Many other {{(6):animals}} live in salt water. / There are sharks / and lots of other fish. / All ocean animals need water. / Water gives them food and oxygen. / Jellyfish are not fish — / they are invertebrates. / They don't have a skeleton. / They need water / to support their bodies.", "たくさんの他の動物が住んでいる／塩水の中に／サメがいる／そしてたくさんの他の魚／すべての海の動物は水が必要です／水は彼らに食べ物と酸素を与える／クラゲは魚ではない／彼らは無脊椎動物です／彼らは骨格を持たない／彼らは水が必要です／支えるために／彼らの体を"]]}], "R2": [{"t": "問12 電子メール（HaruとLisa）", "lines": [["Haru", "Dear Aunt Lisa, / How are you? / I'm going to go to Sydney / next Sunday, on 19th / and stay there for two weeks / {{(1):to study English.}} / It will be my first stay in Sydney. / During my stay, / I want to see you / if you have time. / When is good for you?", "親愛なるリサおばさん／お元気ですか／私はシドニーへ行くつもりです／来週の日曜、19日に／そしてそこに2週間滞在します／英語を勉強するために／それは私の初めてのシドニー滞在です／滞在の間／私はあなたに会いたいです／もしあなたに時間があれば／いつがあなたにとって都合がいいですか"], ["Lisa", "Dear Haru, / Thank you for your e-mail. / I have time on 26th. / Will you be free on that day? / I know a good café restaurant, / so let's have lunch there. / {{(2):It has a meat pie.}} / It's really good. / Do you know a meat pie? / It's very popular here. / I hope you like it. / Also, / {{(2):I want to go to the national park / to watch koalas with you.}} / They are very cute. / We can take pictures with them. / What do you want to do? / I'm looking forward to seeing you soon.", "親愛なるハル／メールをありがとう／私は26日に時間があります／あなたはその日は空いていますか／私はいいカフェレストランを知っています／だからそこで昼食を食べましょう／そこにはミートパイがあります／それは本当においしいです／あなたはミートパイを知っていますか／それはここではとても人気です／あなたが気に入るといいです／また／私は国立公園へ行きたい／あなたとコアラを見るために／それらはとてもかわいいです／私たちはそれらと写真を撮れます／あなたは何をしたいですか／すぐ会えるのを楽しみにしています"]]}, {"t": "問13 動物が危険にさらされている理由（トラ）", "lines": [["本文", "Why are animals in danger? / In 1900 / there were 100,000 tigers in the world. / {{(5)①:Now there are about 6,000.}} / In India, / there were about 30,000 tigers, / and the number is now 2,000. / You could find eight different kinds of tiger / in different countries then. / Now there are only five kinds. / We are never going to see the other three again.", "なぜ動物は危険な状態にあるのか／1900年に／世界に10万頭のトラがいた／今は約6,000頭いる／インドでは／約3万頭のトラがいた／そしてその数は今2,000頭です／8種類の違うトラを見つけることができた／違う国々で／当時／今はたった5種類しかいない／私たちは他の3種類を二度と見ることはない"], ["本文", "The tiger is the biggest animal in the cat family. / Siberian tigers are sometimes 320 kilograms. / They need trees, water, and other animals for food. / The tiger is a beautiful animal, / but it is disappearing. / Why is it disappearing? / And why are other species disappearing / from our world?", "トラはネコ科でいちばん大きな動物です／シベリアのトラは時々320キログラムです／彼らは木、水、そして他の動物が必要です／食べ物のために／トラは美しい動物です／しかしそれは消えつつあります／なぜそれは消えつつあるのですか／そしてなぜ他の種も消えつつあるのですか／私たちの世界から"], ["本文", "Animals are always in danger / from changes in the natural world. / Sometimes {{(1):for years there is little rain}} / and thirsty animals die / because they cannot find water. / {{(2):Bigger animals kill and eat all the small animals,}} / and then the bigger animals die, / because they have no more food. / The natural world changes, / and animals cannot always change with it.", "動物はいつも危険にある／自然界の変化から／時々何年も雨がほとんど降らない／そしてのどのかわいた動物が死ぬ／彼らが水を見つけられないので／より大きな動物がすべての小さな動物を殺して食べる／そしてそれからより大きな動物も死ぬ／彼らにはもう食べ物がないから／自然界は変わる／そして動物はいつもそれと一緒に変わることはできない"], ["本文", "But today, / animal species are disappearing faster. / Now humans are the biggest danger to animals. / Think about tigers again. / People kill them / because {{(3)C:they}} are afraid of {{(3)D:them}}. / {{(5)②:Some people kill them / for their beautiful coats / or for medicine.}} / Other people kill them / because they like hunting big animals. / Or they kill all the smaller animals, / and then the tigers cannot find any food. / People cut down the trees, too, / and take away their habitat. / In all these ways, / tigers are in danger from humans.", "しかし今日／動物の種はもっと速く消えつつある／今や人間が動物へのいちばん大きな危険です／もう一度トラについて考えなさい／人々はそれらを殺す／彼らがそれらをこわがるから／ある人々は殺す／それらの美しい毛皮のために／または薬のために／他の人々はそれらを殺す／彼らが大きな動物を狩るのが好きだから／または彼らはすべてのより小さな動物を殺す／そしてそれからトラは食べ物を見つけられない／人々は木も切り倒す／そして彼らの生息地を奪う／これらすべての方法で／トラは人間から危険にさらされている"], ["本文", "But the problem is not just about tigers. / About 1 percent of the animals in the world / disappear every year / because humans are killing them. / We cannot always protect animals from nature, / but {{(4):we can protect them from us.}}", "しかし問題はトラだけについてではない／世界の動物の約1パーセントが／毎年消える／人間がそれらを殺しているから／私たちはいつも動物を自然から守ることはできない／しかし私たちはそれらを私たち自身から守ることができる"]]}]};

const TOK="(?:\\d+(?:\\.\\d+)?(?:√\\d+)?[a-zℓπ]?²?|[a-zℓπ]|√\\d+)";
const NUMP="(?:\\(([^()\\n]{1,40})\\)|(?<![A-Za-z0-9.ℓπ])("+TOK+")(?![A-Za-z]))";
const DENP="(?:\\(([^()\\n]{1,40})\\)|(\\d+(?:\\.\\d+)?(?:√\\d+)?[a-zℓπ]?²?|[a-zℓπ]|√\\d+)(?![A-Za-z0-9]))";
const FR=new RegExp(NUMP+"/"+DENP,"g");
function fr(t){return rt(frpi(fr0(t)))}
/* 25π/12 の π を分数の横棒の右に出す */
function frpi(t){return t.replace(/<span class='fr'><span>(\d+(?:\.\d+)?)π<\/span><span>([^<]*)<\/span><\/span>/g,"<span class='fr'><span>$1</span><span>$2</span></span>π")}
/* √の中身を横線の下に入れて表示 */
function rt(t){return t.replace(/√(?:\(([^()<>]{1,40})\)|([0-9０-９]+(?:\.[0-9]+)?|[a-zA-Z](?![a-zA-Z])))/g,(m,p,n)=>"<span class='rt'>√<span class='rd'>"+(p||n)+"</span></span>")}
function fr0(t){return t.replace(FR,(m,p1,n1,p2,d1)=>{const n=p1||n1,d=p2||d1;
 if(!/[0-9√π]/.test(n+d)) return m;
 if(/\d[a-z]$/.test(n)&&/^[a-z]$/.test(d)) return m;
 if(p1&&!/[0-9a-zπ√ℓ]/.test(p1)) return m;
 return "<span class='fr'><span>"+n+"</span><span>"+d+"</span></span>"})}
function hint(t){return t.replace(/\{\{([^:}]*):([\s\S]*?)\}\}/g,(m,l,x)=>"<mark class='h'>"+x+"<sup>"+l+"</sup></mark>")}

きなさい。", "例：I agree with wearing our own clothes because we can express ourselves.", "agree with ～ because ～。"], ["例：「私は制服が好きです。なぜなら安いからです。」を英語で書きなさい。（I like ～ because ～）", "例：I like school uniforms because they are cheap.", "I like ～ because ～。"]], "R7_english|10|0": [["Ken is making a news letter. He asks teachers to write about their favorite books. この記事の題名として合うのは？　ア What Is Your Favorite Book?　イ My Summer Trip　ウ School Lunch", "ア", "好きな本の話。"], ["A town is holding a festival. People sing and dance. 題名として合うのは？　ア A Town Festival　イ My Dog　ウ Math Class", "ア", "お祭りの話。"], ["Today I will tell you about my family. 題名として合うのは？　ア Weather News　イ My Family　ウ A Soccer Game", "イ", "家族の話。"]], "R7_english|10|1": [["A: Do you like reading? B: （　）I read every day. に入るのは？　ア Of course.　イ No problem.　ウ See you.", "ア", "好きかどうかの質問にOf course。"], ["A: Can you help me? B: （　）　に入るのは？　ア Sure.　イ Goodbye.　ウ I'm sleepy.", "ア", "手伝って→Sure。"], ["A: Thank you for your help. B: （　）　に入るのは？　ア You're welcome.　イ Good morning.　ウ I'm sorry.", "ア", "お礼にはYou're welcome。"]], "R7_english|10|2": [["A: Books teach us many things. B: （　）　に入るのは？　ア I think so, too.　イ I don't know.　ウ Nice to meet you.", "ア", "同意するI think so, too。"], ["A: English is fun. B: （　）　に入るのは？　ア I think so, too.　イ How old are you?　ウ I'm hungry.", "ア", "同意。"], ["A: This movie is great. B: （　）　に入るのは？　ア I agree.　イ I'm cold.　ウ It's late.", "ア", "同意。"]], "R7_english|10|3": [["次の語を並べて「これは私の母が書いた手紙です」の文を作りなさい。（by／my／a／letter／This／written／is／mother）", "This is a letter written by my mother.", "a letter ＋ written by ～。"], ["次の語を並べて「これは多くの人に愛されている歌です」の文を作りなさい。（a／by／loved／many／This／song／is／people）", "This is a song loved by many people.", "a song ＋ loved by ～。"], ["次の語を並べて「あれは日本で作られた車です」の文を作りなさい。（in／made／That／Japan／is／a／car）", "That is a car made in Japan.", "a car ＋ made in Japan。"]], "R7_english|10|4": [["\"Everyone is different.\" を日本語にしなさい。", "みんな違っている。", "everyone＝みんな、different＝ちがう。"], ["\"Everyone has a good point.\" を日本語にしなさい。（point＝よいところ）", "みん [["「計画を練る」の「練る」の読みをひらがなで答えなさい。", "ねる", "「ね」＋「る」。"], ["「布を染める」の「染める」の読みをひらがなで答えなさい。", "そめる", "染＝そ(める)。"], ["「荷物を運ぶ」の「運ぶ」の読みをひらがなで答えなさい。", "はこぶ", "運＝はこ(ぶ)。"]], "R4_japanese|0|4": [["「整理」の読みをひらがなで答えなさい。", "せいり", "整＝セイ、理＝リ。"], ["「準備」の読みをひらがなで答えなさい。", "じゅんび", "準＝ジュン、備＝ビ。"], ["「確認」の読みをひらがなで答えなさい。", "かくにん", "確＝カク、認＝ニン。"]], "R4_japanese|0|5": [["「ヤマイ」を漢字で書きなさい。（一字）", "病", "病。"], ["「ヤマ」を漢字で書きなさい。（一字）", "山", "山。"], ["「カワ」を漢字で書きなさい。（一字）", "川", "川。"]], "R4_japanese|0|6": [["「ころがる」の「ころ」を漢字で書きなさい。（一字）", "転", "転がる。"], ["「うつる」を漢字で書きなさい。（一字／例：映）", "移", "移る。（場所が変わる）"], ["「うごく」の「うご」を漢字で書きなさい。（一字）", "動", "動く。"]], "R4_japanese|0|7": [["「夏はあつい」の「あつい」を漢字で書きなさい。（気温）", "暑い", "気温は暑い。"], ["「お茶があつい」の「あつい」を漢字で書きなさい。（温度）", "熱い", "ものの温度は熱い。"], ["「あつい本」の「あつい」を漢字で書きなさい。（厚み）", "厚い", "厚みは厚い。"]], "R4_japanese|0|8": [["「ゴミをひろう」の「ひろ」を漢字で書きなさい。（一字）", "拾", "拾う。"], ["「落としものをさがす」の「さが」を漢字で書きなさい。（一字）", "探", "探す。"], ["「ひろい道」の「ひろ」を漢字で書きなさい。（一字）", "広", "広い。"]], "R4_japanese|0|9": [["「ガッコウ」を漢字で書きなさい。", "学校", "学校。"], ["「トショカン」を漢字で書きなさい。", "図書館", "図書館。"], ["「ビョウイン」を漢字で書きなさい。", "病院", "病院。"]], "R4_japanese|1|0": [["（　）が痛い（人の言うことが聞きづらい）の（　）に入る体の部分を答えなさい。", "耳", "耳が痛い。"], ["（　）が高い（得意になる）の（　）に入る体の部分を答えなさい。", "鼻", "鼻が高い。"], ["（　）が重い（行きたくない気持ち）の（　）に入る体の部分を答えなさい。", "足", "足が重い。"]], "R4_japanese|1|1": [["「うつくしい」は、名詞・動詞・形容詞・副詞のどれですか。", "形容詞", "「うつくしかった」と活用する。"], ["「ゆっくり」は、名詞・動詞・形容詞・副詞のどれですか。", "副詞", "活用しない。動詞を修飾。"], ["「走る」は、名詞・動詞・形容詞・副詞のどれですか。", "動詞", "動作を表す。"]], "R4_japanese|1|2": [["短い文：「弟は毎日、自分の部屋をそうじすると約束した。」約束の内容を15字以内で書きなさい。", "自分の部屋をそうじすること", "約束の内容。"], ["短い文：「母は私に、朝は自分で起きるようにと言った。」母が望んだことを書きなさい。", "朝は自分で起きること", "母が望んだこと。"], ["短い文：「先生は、宿題を毎日するようにと言った。」先生が望んだことを書きなさい。", "宿題を毎日すること", "先生が望んだこと。"]], "R4_japanese|1|3": [["短い文：「ぼくは大きな音に気づかなかった。ゲームに夢中だったからだ。」気づかなかった理由を書きなさい。", "ゲームに夢中だったから。", "理由はあとに書いてある。"], ["短い文：「妹は泣いていた。迷子になったからだ。」泣いていた理由を書きなさい。", "迷子になったから。", "理由。"], ["短い文：「試合に負けた。みんなが練習不足だったからだ。」負けた理由を書きなさい。", "練習不足だったから。", "理由。"]], "R4_japanese|1|4": [["「あの時、ちゃんと言えばよかった。」このときの気持ちを二字熟語で答えなさい。", "後悔", "あとで悔やむ気持ち。"], ["「テストで100点をとった。」このときの気持ちを二字熟語で答えなさい。", "満足", "満ち足りた気持ち。（うれしさ等でも可）"], ["「大切なものをなくしてしまった。」このときの気持ちを二字熟語で答えなさい。", "悲しみ", "悲しい気持ち。（落胆等でも可）"]], "R4_japanese|1|5": [["文：「兄は朝、駅へ向かった。あの時、兄は笑っていた。」「あの時」は何を指しますか。", "朝、駅へ向かった時", "直前の場面。"], ["文：「母は台所で料理をしていた。そのとき、電話が鳴った。」「そのとき」は何を指しますか。", "母が料理をしていた時", "直前。"], ["文：「彼は雨の中を走った。その後、風邪をひいた。」「その後」は何の後ですか。", "雨の中を走った後", "直前。"]], "R4_japanese|1|6": [["文：「列車が行ってしまった。私は一人でホームに残された。」「このようなこと」の内容を簡単に書きなさい。", "列車が行き、一人で残されたこと。", "直前の場面。"], ["文：「バスに乗りおくれた。遅刻してしまった。」「このようなこと」を簡単に書きなさい。", "バスにおくれて遅刻したこと。", "直前の場面。"], ["文：「かぎを忘れた。家に入れなかった。」「このようなこと」を簡単に書きなさい。", "かぎを忘れて家に入れなかったこと。", "直前の場面。"]], "R4_japanese|1|7": [["例：「厳しく叱りながらも、母は心の中で子を大切に思っていた。」母の気持ちを2つの面から書きなさい。", "例：厳しさと子を思う優しさ", "「厳しさ」と「いとおしさ」の2面。"], ["例：「先生は怒ったが、本当は生徒を心配していた。」先生の気持ちを2つの面から書きなさい。", "例：怒りと心配", "2つの気持ち。"], ["例：「彼は笑っていたが、心の中は不安でいっぱいだった。」彼の気持ちを2つの面から書きなさい。", "例：うれしそうな表情と不安", "2つの気持ち。"]], "R4_japanese|2|0": [["表の項目「自分は将来に希望がある」から、「希望」を抜き出しなさい。", "希望", "項目名から。"], ["表の項目「自分は役に立つ人間だと思う」から、「役に立つ」を抜き出しなさい。", "役に立つ", "項目名から。"], ["表の項目「自分の国を好きだ」から、「好き」を抜き出しなさい。", "好き", "項目名から。"]], "R4_japanese|2|1": [["表の項目「自分で社会を変えられる」から、「変えられる」を抜き出しなさい。", "変えられる", "項目名から。"], ["「自分で決められる」から、「決められる」を抜き出しなさい。", "決められる", "項目名から。"], ["「自分で解決できる」から、「解決」を抜き出しなさい。", "解決", "項目名から。"]], "R4_japanese|2|2": [["表の項目「解決したい問題がある」から、「問題」を抜き出しなさい。", "問題", "項目名から。"], ["表の項目「やりたい仕事がある」から、「仕事」を抜き出しなさい。", "仕事", "項目名から。"], ["表の項目「行きたい国がある」から、「国」を抜き出しなさい。", "国", "項目名から。"]], "R4_japanese|2|3": [["「うまくいかないと、（　）のせいにしがちだ」に入る言葉を、二字で答えなさい。（自分以外の人）", "他人", "他人のせい。"], ["「責任を（　）にしてはいけない」に入る言葉（自分以外の人に押しつけない）を二字で答えなさい。", "他人", "他人。"], ["「失敗を自分の（　）だと考える」に入る一字を答えなさい。（「せい」の前）", "せい", "自分のせい。"]], "R4_japanese|2|4": [["「見ますか」の尊敬語を答えなさい。（「ご覧になりますか」）", "ご覧になりますか", "「見る」の尊敬語は「ご覧になる」。"], ["「言いますか」の尊敬語を答えなさい。", "おっしゃいますか", "「言う」の尊敬語は「おっしゃる」。"], ["「来ますか」の尊敬語を答えなさい。", "いらっしゃいますか", "「来る」の尊敬語は「いらっしゃる」。"]], "R4_japanese|2|5": [["グラフ：日本の発電は石炭30％、天然ガス40％、石油7％、水力8％、その他15％です。火力発電（石炭・天然ガス・石油）は何％ですか。", "77", "30＋40＋7＝77％。"], ["グラフ：A国の発電は水力60％、火力30％、その他10％で
